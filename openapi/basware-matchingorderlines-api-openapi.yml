    GoodsReceiptEntity:
      required:
      - externalCode
      - goodsReceiptNumber
      - quantity
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: Identifies the goods receipt for future updates through Basware API. Typically Generated by the system calling Basware API.
          example: 234-3444-74334667-1434612
        goodsReceiptNumber:
          maxLength: 100
          minLength: 1
          type: string
          description: Goods receipt number.
          example: '487632933422'
        goodsReceiptLineNumber:
          maxLength: 25
          minLength: 0
          type: string
          description: Goods receipt line number.
          nullable: true
          example: '1'
        referenceGRExternalCode:
          maxLength: 36
          minLength: 0
          type: string
          description: "Used to cancel (part of) an existing goods receipt. Place the 'externalCode' value of the original goods receipt here when this receipt item is a negative return/cancellation item for an earlier receipt. \r\n\r\nNote: If the original GR does not have netPrice / grossPrice, reversing part of the original GR will set the netSum / grossSum of the original GR to 0. This happens because the the sums get recalculated based on quantity x (net/gross)Price when values are updated."
          nullable: true
          example: ''
        deliveryNoteNumber:
          maxLength: 250
          minLength: 0
          type: string
          description: Identifier of the delivery from where the receipt was made.
          nullable: true
          example: '8718232387'
        bestFitGrouping:
          maxLength: 250
          minLength: 0
          type: string
          description: Grouping factor for received items that are invoiced together without any delivery indicator. The value can be for example a delivery note number or a delivery date. Used in best-fit matching.
          nullable: true
          example: '4847432142354'
        quantity:
          type: number
          description: Received quantity
          format: double
          example: 10
        netSum:
          type: number
          description: 'Total currency value of the received items, excluding tax. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          nullable: true
          example: 1000
        grossSum:
          type: number
          description: 'Total currency value of the received items, including tax. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          nullable: true
          example: 1160
        netPrice:
          type: number
          description: "The unit price of the received item (price for a single item), excluding tax. \r\n\r\nNote: If the original GR does not have netPrice, reversing part of the original GR (done using 'referenceGRExternalCode' field) will set the netSum of the original GR to 0. This happens because the netSum gets recalculated based on quantity x netPrice when values are updated."
          format: double
          nullable: true
          example: 100
        grossPrice:
          type: number
          description: "The unit price of the received item (price for a single item), including tax.\r\n\r\nNote: If the original GR does not have grossPrice, reversing part of the original GR (done using 'referenceGRExternalCode' field) will set the grossSum of the original GR to 0. This happens because the grosstSum gets recalculated based on quantity x grossPrice when values are updated."
          format: double
          nullable: true
          example: 116
        isDeleted:
          type: boolean
          description: 'Indicates whether the received item is deleted. If TRUE, the received item has been marked as deleted. Default value: FALSE.'
          nullable: true
          example: false
        notifyFault:
          type: boolean
          description: Used to indicate goods have been received as damaged. 'True' if goods are faulty. P2P can be configured to stop automatic invoice processing when an invoice has been matched against damaged goods.
          nullable: true
          example: false
        invoicedQuantity:
          type: number
          description: Quantity that already has been matched from the line item
          format: double
          nullable: true
          example: 0
        invoicedNetSum:
          type: number
          description: Sum that already has been matched excluding tax
          format: double
          nullable: true
        invoicedGrossSum:
          type: number
          description: Sum that already has been matched including tax
          format: double
          nullable: true
        unitOfMeasure:
          maxLength: 25
          minLength: 0
          type: string
          description: Unit of measure of the line item. Valid value is UN/ECE CEFACT Trade Facilitation Recommendation No. 20 common code value represented as string.
          nullable: true
