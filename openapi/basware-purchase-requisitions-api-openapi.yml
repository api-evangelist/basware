openapi: 3.2.0
info:
  title: Basware APIs for Purchase-to-Pay and Master Data import…
  description: The Basware APIs documented here are for Purchase-to-Pay use cases and for importing Master Data to Basware services.
  version: v1
servers:
- url: ''
security:
- Bearer: []
- oauth2authentication: []
tags:
- name: Purchase Requisitions
paths:
  /v1/purchaseRequisitions:
    get:
      tags:
      - Purchase Requisitions
      summary: Returns purchase requisitions posted to Basware API
      description: 'Note: Updating data for existing requisitions is not supported. Posting updates will result in errors in errorFeedbacks -interface and data will not be updated in Alusta Purchase. The data will still be accepted and updated in Basware API. Because of this updates to existing purchase requisition records will result in inconsistent data between GET operations to Basware API and Alusta Purchase.'
      parameters:
      - name: pageSize
        in: query
        description: A limit for the number of items to be returned for one request. Limit can range between 1 and 100 items.
        schema:
          type: integer
          format: int32
          default: 100
      - name: companyCode
        in: query
        description: Company filter. Returns items for specific company.
        schema:
          type: string
          default: ''
      - name: lastUpdated
        in: query
        description: Date Filter. Returns items that have been updated after specified date.
        schema:
          type: string
          format: date-time
      - name: x-amz-meta-continuationtoken
        in: header
        description: Used to get next page of results when item count indicated by 'pageSize' is exceeded. A token is returned in header (not body) parameter 'X-amz-meta-continuationToken' of the response whenever there are more records to fetch. Post the received value here in a new HEADER parameter on the next GET request to receive the next page of results. When getting the next page of results, you must include the same query parameters that were used when getting the first page.
        schema:
          type: string
        example: 1c121d65-110b-4027-b306-e7525d4e716f
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1PurchaseRequisitions
      x-operation-id-source: derived
    post:
      tags:
      - Purchase Requisitions
      summary: Creates new purchase requisition(s).
      description: 'Notes:

        1. Any referenced vendors, users, etc. need to exist in P2P when the purchase requisition is imported.

        2. Updating data for existing requisitions is not supported. Posting updates will result in errors in errorFeedbacks -interface and data will not be updated in Alusta Purchase. The data will still be accepted and updated in Basware API. Because of this updates to existing purchase requisition records will result in inconsistent data between GET operations to Basware API and Alusta Purchase.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API. Check out also the example JSONs using a minimal feasible set of fields from the developer site.'
      parameters:
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseRequisitionEntity'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseRequisitionEntity'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseRequisitionEntity'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: postV1PurchaseRequisitions
      x-operation-id-source: derived
    delete:
      tags:
      - Purchase Requisitions
      summary: Deletes data from Basware API. For manual one-time operations
      description: 'For manual one-time operations only, such as a manual clean-up to remove test data generated during API integration development. Only removes records from API layer.

        Deletion in target systems needs to be done separately using the data deletion mechanisms available in each of the target system in addition to deleting the data in Basware API.'
      requestBody:
        description: "Contains the body of the request.\n            Either externalCode or lastUpdated -field is required. If both values are provided, externalCode will have the priority."
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '202':
          description: RequestAccepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: BadRequest
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: deleteV1PurchaseRequisitions
      x-operation-id-source: derived
  /v1/purchaseRequisitions/{externalCode}:
    get:
      tags:
      - Purchase Requisitions
      summary: Returns single purchase requisition by externalCode -identifier
      description: 'Note: Updating data for existing requisitions is not supported. Posting updates will result in errors in errorFeedbacks -interface and data will not be updated in Alusta Purchase. The data will still be accepted and updated in Basware API. Because of this updates to existing purchase requisition records will result in inconsistent data between GET operations to Basware API and Alusta Purchase.'
      parameters:
      - name: externalCode
        in: path
        description: ExternalCode of the entity to be fetched
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionEntity'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1PurchaseRequisitionsByExternalCode
      x-operation-id-source: derived
components:
  schemas:
    RequisitionLine:
      required:
      - currencyCode
      - externalCode
      - extRequisitionLineNumber
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: External identifier that is used as a key in API for the requisition line.
          example: 987236sd-sd31-3562-1239-9asffa986asd
        extRequisitionLineNumber:
          minLength: 1
          type: string
          description: The requisition line number in the external system. The value must be unique for each line on the requisition.
          example: '1'
        categoryCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: "Code for the item's purchasing category. The code must match a valid, active purchasing category for the organization. \nIf invalid, the field will be emptied during import."
          example: '6200'
        supplierCode:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: "A code to identify the supplier. The code must match a valid supplier for the organization, or it will be emptied during import. \nIf the purchase order is a self-service order and the supplier is invalid, the import will fail."
          example: '10280'
        supplierName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier name.
          example: ACME IT services and suppliers
        contractNumber:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Contract number.
          example: ''
        buyerProductCode:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: A code that identifies purchased items for internal reporting and communication.
          example: '38172105'
        supplierProductName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier product name.
          example: Developer laptop, 15inch
        supplierProductCode:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier product code.
          example: 00494233
        manufacturerProductCode:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Manufacturer product code is an identification number supplied by a manufacturer to uniquely identify products that aren't easily distinquishable from one another. It allows consumers to search for the exact product they need without any technical knowledge. Commonly used for example with automotive or electronics replacement parts. Required P2P 23.10 or later.
          example: ManufacturerProductCode
        description:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Description.
          example: ''
        leadTime:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Specifies how soon after receiving order the supplier usually is able to deliver the goods. Informative field.
          example: ''
        desiredDeliveryDate:
          type:
          - string
          - 'null'
          description: Desired date the goods are to be delivered.
          format: date-time
          example: '2020-01-08T00:00:00'
        deliveryTerm:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Identifier for the agreed delivery term for the item. If empty, supplier's delivery term is used.
          example: ''
        allowPartialDeliveries:
          type:
          - boolean
          - 'null'
          description: Indicates if the partial delivery of goods is allowed. If empty, defaults to false.
          example: false
        paymentTermCode:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: "Identifier for the agreed payment term to be used when supplier charges the customer. \nIf empty, defaults to the supplier's payment term."
          example: NT60
        paymentTermName:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Name of the payment term.
          example: 60 days net
        additionalInfo:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Additional information.
          example: ''
        receiveAutomatically:
          type:
          - boolean
          - 'null'
          description: Indicates if the goods can be automatically received by Basware P2P on behalf of the user. If empty, defaults to false.
          example: false
        plant:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Plant.
          example: ''
        storageLocation:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Storage location.
          example: ''
        unspsc:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
          description: "The United Nations Standard Products and Services Code, a unique 8-digit number used to identify trade items, products, and services. \nThe value can also be used to match order lines to invoice lines. If empty, resolved by Basware P2P using the item's categoryCode."
          example: '43211578'
        grNote:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Note for receiving goods.
          example: ''
        lineDataDate1:
          type:
          - string
          - 'null'
          description: LineDataDate1-5 can be used for customer-specific date fields. This data will go to ‘Line data’ -tab of the requisition line in P2P.
          format: date-time
        lineDataDate2:
          type:
          - string
          - 'null'
          format: date-time
        lineDataDate3:
          type:
          - string
          - 'null'
          format: date-time
        lineDataDate4:
          type:
          - string
          - 'null'
          format: date-time
        lineDataDate5:
          type:
          - string
          - 'null'
          format: date-time
        lineDataNum1:
          type:
          - number
          - 'null'
          description: LineDataNum1-5 can be used for customer-specific numeric fields. This data will go to ‘Line data’ -tab of the requisition line in P2P.
          format: double
        lineDataNum2:
          type:
          - number
          - 'null'
          format: double
        lineDataNum3:
          type:
          - number
          - 'null'
          format: double
        lineDataNum4:
          type:
          - number
          - 'null'
          format: double
        lineDataNum5:
          type:
          - number
          - 'null'
          format: double
        lineDataText1:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: LineDataText1-5 can be used for customer-specific text fields. This data will go to ‘Line data’ -tab of the requisition line in P2P.
          example: ''
        lineDataText2:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText3:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText4:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText5:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        quantity:
          type:
          - number
          - 'null'
          description: Defines how many items a customer wants to purchase. The quantity must contain a positive value.
          format: double
          example: 1
        quantityUnitCode:
          maxLength: 10
          minLength: 0
          type:
          - string
          - 'null'
          description: Quantity unit code.
          example: PCS
        quantityUnitName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Quantity unit name.
          example: Pieces
        priceType:
          enum:
          - Net
          - Gross
          type: string
          description: Defines if the unit price stated is net (0) or gross (1). If empty, defaults to net (0).
          example: Net
        subUOM:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Sub-unit of measure, when used.
          example: ''
        refundLine:
          type: boolean
          description: Specifies whether the line is a refund line. True = refund line, false = not a refund line. Prices needs to be be negative on refund lines.
          example: false
        unitPrice:
          type:
          - number
          - 'null'
          description: Price for a single unit without discount. Price type (Net / Gross) is specified in field 'priceType'.
          format: double
          example: 1050
        discountPercent:
          maximum: 1000000000
          minimum: 0
          type:
          - number
          - 'null'
          description: Discount percent.
          format: double
          example: 0
        currencyCode:
          maxLength: 25
          minLength: 1
          type: string
          description: "A code that identifies the currency of the price on the line. All requisition lines must have the same currency code. \nIf the code is different from the organization's currency, an exchange rate must exist for both codes in Basware P2P Administration, or the import will fail."
          example: EUR
        taxCode:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Defines name for the tax code. If empty, Basware P2P resolves the value using the tax percent from the purchasing category.
          example: T25
        taxJuristictionCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Tax juristiction code.
          example: ''
        taxPercent:
          maximum: 1000000000
          minimum: 0
          type:
          - number
          - 'null'
          description: Defines the tax percent. If empty, Basware P2P resolves the value using the tax percent from the purchasing category.
          format: double
          example: 10
        taxPercent2:
          type:
          - number
          - 'null'
          description: Second tax percent. Used for example for handling reverse charges on EU VAT.
          format: double
          example: 0
        attachPdfToNetworkOrder:
          type:
          - boolean
          - 'null'
          description: Specifies if order is attached as pdf file when order is sent to supplier through Basware network.
        ownerOrderingEmail:
          maxLength: 1800
          minLength: 0
          pattern: ^(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*)@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          type:
          - string
          - 'null'
          description: 'Contact email to which supplier can send questions about the order. Note: When order is sent to supplier, it is not sent to this email. Note: Fields visible on the order sent to supplier are configured in P2P Purchase.'
          example: john.smith@company.com
        orderRecipientType:
          enum:
          - Supplier
          - Owner
          - SupplierAndOwner
          type: string
          description: 'Determines who order is sent to.

            -Supplier(0) : Order is sent only to supplier.

            -If orderingMethod is email, order is sent to the email indicated by ''supplierOrderingEmail''. -If orderingMethod is network, the order is sent through Basware network.

            -Owner (1): Order is sent only to email address(es) indicated by field ''otherOrderingEmail''. Used for example when goods were picked up from a store and no order needs to be sent to supplier.

            -SupplierAndOwner (2): Order is sent to both supplier and email addresses indicated by field ''otherOrderingEmail''. Order delivery method to supplier is determined by orderingMethod, same as above.'
          example: '0'
        supplierOrderingEmail:
          maxLength: 1800
          minLength: 0
          pattern: ^(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*)@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          type:
          - string
          - 'null'
          description: Email address used to override the default supplier email address, when orderRecipientType is Supplier or SupplierAndOwner.
          example: john.smith@company.com
        otherOrderingEmail:
          pattern: ^(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*)@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          type:
          - string
          - 'null'
          description: The email address(es) where the order is sent by P2P purchase. Can contain multiple email addresses separated by semicolon. The order is sent to these addresses when orderRecipientType is 'Owner' or 'Both'.
          example: john.smith@company.com
        conversionNumerator:
          type:
          - number
          - 'null'
          description: Conversion numerator.
          format: double
        conversionDenominator:
          type:
          - number
          - 'null'
          description: Conversion denominator.
          format: double
        materialGroup:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Material group.
          example: ''
        linePricingDate1:
          type:
          - string
          - 'null'
          description: LinePricingDate1-5 can be used for customer-specific date fields. This data will go to ‘Pricing’ -tab of the requisition line in P2P.
          format: date-time
        linePricingDate2:
          type:
          - string
          - 'null'
          format: date-time
        linePricingDate3:
          type:
          - string
          - 'null'
          format: date-time
        linePricingDate4:
          type:
          - string
          - 'null'
          format: date-time
        linePricingDate5:
          type:
          - string
          - 'null'
          format: date-time
        linePricingNum1:
          type:
          - number
          - 'null'
          description: LinePricingNum1-5 can be used for customer-specific numeric fields. This data will go to ‘Pricing’ -tab of the requisition line in P2P.
          format: double
        linePricingNum2:
          type:
          - number
          - 'null'
          format: double
        linePricingNum3:
          type:
          - number
          - 'null'
