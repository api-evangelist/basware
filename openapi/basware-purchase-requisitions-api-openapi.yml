          description: "Notes: \n1) The requisition must contain at least one line, and can contain up to 200 lines. \n2) When Basware P2P creates the requisition it numbers the lines internally based on their order in the JSON. \n3) All lines on the requisition must have the same currencyCode. \n4) At least one line must contain a positive Quantity value. \n5) Total price for each requisition line is calculated by Basware P2P from the quantity, unit price, and applicable taxes and discounts.\n6) All supplierCodes stated on requisition lines needs to exist in P2P as valid supplier. These suppliers needs to have an ordering method defined in P2P (else requisition will be imported with empty supplier). Suppliers using email ordering method need also to have a valid ordering email defined. \n7) If there are refund lines, the requisition must have at least one non-refund line. \n8) If there are refund lines, only one order needs to result from the requisition lines."
