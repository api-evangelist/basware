openapi: 3.2.0
info:
  title: Basware APIs for Purchase-to-Pay and Master Data import…
  description: The Basware APIs documented here are for Purchase-to-Pay use cases and for importing Master Data to Basware services.
  version: v1
servers:
- url: ''
security:
- Bearer: []
- oauth2authentication: []
tags:
- name: Purchase Orders
paths:
  /v1/purchaseOrders:
    get:
      tags:
      - Purchase Orders
      summary: Returns imported purchase orders
      description: 'Note: This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.'
      parameters:
      - name: processingStatus
        in: query
        description: Document status filter. Returns items by purchase order status.
        schema:
          enum:
          - Uncompleted
          - ReadyForImport
          - ImportInProgress
          - Imported
          - ImportFailed
          type: string
      - name: pageSize
        in: query
        description: A limit for the number of items to be returned for one request. Limit can range between 1 and 100 items.
        schema:
          type: integer
          format: int32
          default: 100
      - name: lastUpdated
        in: query
        description: Date filter. Returns items that have been updated after specified date.
        schema:
          type: string
          format: date-time
      - name: x-amz-meta-continuationtoken
        in: header
        description: Used to get next page of results when item count indicated by 'pageSize' is exceeded. A token is returned in header (not body) parameter 'X-amz-meta-continuationToken' of the response whenever there are more records to fetch. Post the received value here in a new HEADER parameter on the next GET request to receive the next page of results. When getting the next page of results, you must include the same query parameters that were used when getting the first page.
        schema:
          type: string
        example: ac0108a2-5ade-4b78-8d57-1e4d5999cb83
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1PurchaseOrders
      x-operation-id-source: derived
    post:
      tags:
      - Purchase Orders
      summary: Creates new purchase order(s), fully overwrites previous record if exists.
      description: 'Notes:

        1. Any referenced vendors, users, payment terms, purchasing categories, quantity units, etc. need to exist in P2P when the purchase order is posted.

        2. Orders are technically handled as auto-approved requisitions resulting in a corresponding order being created. If you don''t find the order in P2P UI, try looking for it as a requisition. It might have invalid data (see above) or the requisition approval process may be configured in a way to block automatic order creation.

        3. Field ''processingStatus'' requires a value from API user in POST and PATCH request. If you need to import an order with more than 200 lines, this can be done by setting ''processingStatus'' to ''Uncompleted'' when POSTing the purchaseOrder and then adding additional lines to it using the PATCH method. ProcessingStaus: ''Uncompleted'' prevents the order from being set to P2P so that more lines can be added. When all lines have been added, set ''processingStaus'' = ''ReadyForImport'' using PATCH method and the order will be imported to P2P.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API. Check out also the example JSONs using a minimal feasible set of fields from the developer site.'
      parameters:
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseOrderEntity'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseOrderEntity'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseOrderEntity'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseOrderEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PurchaseOrderEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderEntity'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: postV1PurchaseOrders
      x-operation-id-source: derived
    delete:
      tags:
      - Purchase Orders
      summary: Deletes data from Basware API. For manual one-time operations
      description: 'For manual one-time operations only, such as a manual clean-up to remove test data generated during API integration development. Only removes records from API layer.

        Deletion in target systems needs to be done separately using the data deletion mechanisms available in each of the target system in addition to deleting the data in Basware API.'
      requestBody:
        description: "Contains the body of the request.\n            Either externalCode or lastUpdated -field is required. If both values are provided, externalCode will have the priority."
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '202':
          description: RequestAccepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: BadRequest
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: deleteV1PurchaseOrders
      x-operation-id-source: derived
  /v1/purchaseOrders/{externalCode}:
    get:
      tags:
      - Purchase Orders
      summary: Returns single imported purchase order by orderId - identifier
      description: 'Note: This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.'
      parameters:
      - name: externalCode
        in: path
        description: The externalCode of the purchaseOrder to be fetched
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrdersResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1PurchaseOrdersByExternalCode
      x-operation-id-source: derived
    patch:
      tags:
      - Purchase Orders
      summary: Updates fields on specified order line.
      description: 'Notes:

        1) Field ''processingStatus'' requires a value from API user in POST and PATCH request. If you need to import an order with more than 200 lines, this can be done by setting ''processingStatus'' to ''Uncompleted'' when POSTing the purchaseOrder and then adding additional lines to it using the PATCH method. ProcessingStaus: ''Uncompleted'' prevents the order from being set to P2P so that more lines can be added. When all lines have been added, set ''processingStaus'' = ''ReadyForImport'' using PATCH method and the order will be imported to P2P.

        2) Basware API considers ''null'' value in field(s) equivalent to the field(s) not being sent. For this reason patch method does not support setting field values to ''null''.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API. Check out also the example JSONs using a minimal feasible set of fields from the developer site.'
      parameters:
      - name: externalCode
        in: path
        description: The externalCode of the imported purchase order to be updated
        required: true
        schema:
          type: string
      requestBody:
        description: Entity to be updated
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderEntity'
          text/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderEntity'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OrderLineEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLineEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderLineEntity'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to update not found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '503':
          description: Service Unavailable
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: patchV1PurchaseOrdersByExternalCode
      x-operation-id-source: derived
components:
  schemas:
    OrderLineEntity:
      required:
      - externalCode
      - lineNumber
      - matchingMode
      - orderExternalCode
      - quantity
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: Identifies the order line for future updates through Basware API.
          example: 6741ecc7-848a-443c-83ad-ea95e4df06yh
        orderExternalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: Links the order line to the corresponding order header. The header needs to have been posted to API before order line(s).
          example: 6741ecc7-848a-443c-83ad-ea95e4df06fa
        lineNumber:
          maxLength: 100
          minLength: 1
          type: string
          description: Purchase order row number.
          example: '1'
        sortNumber:
          type:
          - integer
          - 'null'
          description: Technical row number, used also for sorting. Typically the same as purchase order row number.
          format: int32
          example: 1
        quantity:
          type: number
          description: Defines how many items a customer has purchased. The quantity must be higher than zero. With isBlanketOrderLine TRUE, the quantity must be set 1. For service PO's quantity must always be 1.
          format: double
          example: 10
        netSum:
          type:
          - number
          - 'null'
          description: 'Total currency amount excluding tax amount of the purchase order line. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          example: 1000
        grossSum:
          type:
          - number
          - 'null'
          description: 'Total currency amount including tax amount of the purchase order line. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          example: 1160
        currencyCode:
          maxLength: 3
          minLength: 2
          type:
          - string
          - 'null'
          description: A code that identifies the currency of the total payable amount in the purchase order line. Valid values are in ISO 4217 Alpha format. When empty, the currency from the purchase order is used. It is possible to have different currencies in order lines with different needs like products and transportation costs. Exchange rates for matching are based on the exchange rate date defined in the purchase invoice. Gain/loss is expected based on the difference between rate on receive date and rate on invoice date.
          example: USD
        matchingMode:
          enum:
          - Standard
          - Blanket
          - Return
          - Service
          type: string
          description: "Specifies how the order row is handled when matching invoice lines to order lines.\n'Standard' - Standard matching, based on quantities and sums.\n'Blanket' - Matching is based on sum. Quantity is fixed to '1' and is not used in matching. \n'Return' - Standard matching with negative unit price. Used when a new PO is needed for matching against returned items. \n'Service' - Service PO, are sum based PO's. Quantity is not considered here, default quantity is always 1 in these PO's."
          example: Standard
        isReceiptRequired:
          type:
          - boolean
          - 'null'
          description: Indicates whether the line item requires receipts. When FALSE, the line item does not require receipts. When TRUE, the system evaluates the received quantity and sum at the time of matching. When field omitted, value gets defaulted to 'false' in P2P. Value 'true' is not allowed with matchingMode = 'Blanket'. For service PO's IsReceiptRequired is mandatory and value must always be true.
          example: true
        isReceiptBasedMatching:
          type:
          - boolean
          - 'null'
          description: Indicates whether the matching takes place with line item or a goods receipt. When FALSE, a matched invoice is associated with the purchase order line and one coding line is generated per matched order line. When TRUE, an invoice is matched with a goods receipt that belongs to the line item and one coding line is generated for each of the goods receipts under the order line. When field omitted, value gets defaulted to 'false' in P2P. For service PO's IsReceiptBasedMatching is mandatory and value must always be true.
          example: true
        isOverreceivalAllowed:
          type:
          - boolean
          - 'null'
          description: Indicates whether over-delivery is allowed for the line item. When FALSE, the system evaluates the matching using the ordered quantity instead of possible higher quantity from receipts.
          example: false
        isClosed:
          type:
          - boolean
          - 'null'
          description: Indicates whether the line item is closed.  When TRUE, new receipts are not expected for the order line and matching is possible only with unmatched or partly matched goods receipts that have been recorded to the purchase order earlier. When FALSE, the order line is open for new deliveries and matching. When field omitted, value gets defaulted to 'false' in P2P.
          example: false
        isDeleted:
          type:
          - boolean
          - 'null'
          description: 'Indicates whether the line item is deleted. If TRUE, the line item has been marked as deleted. Default value: FALSE. Note: This field must have a value if an order line is intended to be matched with an invoice using best-fit recognition methods.'
          example: false
        isSelfApproved:
          type:
          - boolean
          - 'null'
          description: Specifies has the PO line bypassed standard requisition approval flow in PO source system before order line has been sent to P2P. If true, approval has been bypassed in PO seource system. Invoices matched to such PO lines can be sent to additional approval in P2P.
          example: false
        uom:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Unit of measure of the line item. Valid value is UN/ECE CEFACT Trade Facilitation Recommendation No. 20 common code value represented as string.
          example: PCS
        subUOM:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Alternative unit of measurement of the line item. Valid value is UN/ECE CEFACT Trade Facilitation Recommendation No. 20 common code value represented as string.
          example: G
        netPrice:
          type:
          - number
          - 'null'
          description: 'The price of the line item excluding tax. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          example: 100
        grossPrice:
          type:
          - number
          - 'null'
          description: 'The price of the line item including tax. Note: Either net or gross currency amounts are required on the entire purchase order (both can be provided). Depending on type of provided amounts, either net or gross -based invoice matching can be used.'
          format: double
          example: 116
        priceUnit:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: The unit by which the line item is sold (boxes, litres, tons, pcs, kg, etc). Reguired when using line-level invoice matching with unit validation.
          example: BOX
        priceUnitDescription:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Name of the price unit.
          example: BOX
        taxCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Tax code.
          example: VN
        taxPercent:
          maximum: 1000000000
          minimum: 0
          type:
          - number
          - 'null'
          description: Tax percentage.
          format: double
          example: 16
        taxPercent2:
          type:
          - number
          - 'null'
          description: Return tax.
          format: double
          example: 0
        taxSum:
          type:
          - number
          - 'null'
          description: Tax sum.
          format: double
          example: 160
        taxSum2:
          type:
          - number
          - 'null'
          description: Tax sum 2.
          format: double
        invoicedQuantity:
          type:
          - number
          - 'null'
          description: Quantity that already has been matched from the line item.
          format: double
          example: 0
        invoicedNetSum:
          type:
          - number
          - 'null'
          description: Sum that already has been matched, excluding tax.
          format: double
          example: 0
        invoicedGrossSum:
          type:
          - number
          - 'null'
          description: Sum that already has been matched, including tax.
          format: double
          example: 0
        validFrom:
          type:
          - string
          - 'null'
          description: 'Date when the validity of the purchase order starts. Valid values are in format: CCYY-MM-DD. If the time zone is known, it must be represented with +hh:mm or -hh:mm or Z (which means UTC). If the time zone is not known, it must be left empty.'
          format: date-time
          example: '2018-01-01T07:36:13.053Z'
        validTo:
          type:
          - string
          - 'null'
          description: 'Date when the validity of the purchase order ends. Valid values are in format: CCYY-MM-DD. If the time zone is known, it must be represented with +hh:mm or -hh:mm or Z (which means UTC). If the time zone is not known, it must be left empty.'
          format: date-time
          example: '2018-12-31T07:36:13.053Z'
        productCode:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: A code that identifies the purchased items to the party that is the supplier of the goods/services. This is typically matched to the product code on invoice lines. Required when using line-level invoice matching.
          example: '1950469687'
        productName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Name of the product
          example: Envelopes A5 - 1000 pce/package
        materialGroup:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: A code that groups together several materials or services with the same characteristics
          example: Communication
        globalTradeItemNumber:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: The GTIN is a globally unique 14-digit number used to identify trade items, products, or services. Can also be used to match order rows to invoice lines.
          example: 00012345678905
        unspsc:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: The United Nations Standard Products and Services Code is a unique 8-digit number used to identify trade items, products, and services. Can also be used to match order rows to invoice lines.
          example: '44121504'
        buyerProductCode:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: A code that identifies purchased items for internal reporting and communication
          example: env0002
        contractNumber:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Contract number.
          example: '123456'
        description:
          maxLength: 1000
          minLength: 0
          type:
          - string
          - 'null'
          description: Description of the business document's line item
          example: ''
        comment:
          maxLength: 1000
          minLength: 0
          type:
          - string
          - 'null'
          description: Free-form text pertinent to this document, conveying information that is not contained explicitly in other structures
          example: ''
        requestedDeliveryDate:
          type:
          - string
          - 'null'
          description: 'Date the goods are to be delivered. Valid values are in format: CCYY-MM-DD. If the time zone is known, it must be represented with +hh:mm or -hh:mm or Z (which means UTC). If the time zone is not known, it must be left empty.'
          format: date-time
          example: '2018-07-02T07:36:13.053Z'
        actualDeliveryDate:
          type:
          - string
          - 'null'
          description: 'Date the goods are to be delivered. Valid values are in format: CCYY-MM-DD. If the time zone is known, it must be represented with +hh:mm or -hh:mm or Z (which means UTC). If the time zone is not known, it must be left empty.'
          format: date-time
          example: '2018-07-02T07:36:13.053Z'
        text1:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Text1-10 are available for customer-specific text fields.
          example: ''
        text2:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text3:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text4:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text5:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text6:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text7:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text8:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text9:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        text10:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        numeric1:
          type:
          - number
          - 'null'
          description: Numeric-5 are available for customer-specific numeric fields.
          format: double
        numeric2:
          type:
          - number
          - 'null'
          format: double
          example: 0
        numeric3:
          type:
          - number
          - 'null'
          format: double
          example: 0
        numeric4:
          type:
          - number
          - 'null'
          format: double
          example: 0
        numeric5:
          type:
          - number
          - 'null'
          format: double
          example: 0
        date1:
          type:
          - string
          - 'null'
