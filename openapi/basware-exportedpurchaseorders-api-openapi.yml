          description: "Unique external identifier that is used as a key in API. \nIdentifies goods receipt line for updates through API."
          example: 060cb8ea-5464-11ea-a38b-2e728ce88123
        grHeaderExternalCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: "Unique external identifier that is used as a key in API. \nIdentifies goods receipt document for updates through API. On goods receipt document can contain multiple goods receipt lines."
          example: dlaskjdg-d264-11kj-asdb-22idulkjahs8
        goodsReceiptNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Basware P2P goods receipt document number for the GR.
          example: '98762139'
        documentLink:
          type:
          - string
          - 'null'
          description: Specifies URL to view corresponding GR in Alusta.
          format: uri
          example: http://customertenant.p2p.basware.com/Portal/Default.aspx?forms=1&sl=1&tid=customertenant&dl=(Search/GoodsReceiptSearchDetails-GrId(e105de8f-3e13-4487-a7e5-8c1ba12d7ea9))
        extGoodsReceiptNumber:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Goods receipt document number in external system (for imported goods receipts)
          example: '9732816'
        deliveryNoteNumber:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Reference to delivery note this delivery relates to.
          example: D871263998
        goodsReceiptDocumentCreationTime:
          type: string
          description: Timestamp when goods receipt document was entered to receiving system. This data key-in timestamp may differ from receivingDate if data key-in is not done at the same time.
          format: date-time
          example: '2020-10-24T00:00:00'
        receivingDate:
          type: string
          description: Date on which goods have been received.
          format: date-time
          example: '2020-10-24T00:00:00'
        goodsReceiptLocationAddress:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Specifies where the receiving took place (Order Location).
          example: ''
        productSerialNumber:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Product serial number.
          example: ''
        receivedQuantity:
          type: number
          description: Quantity received.
          format: double
          example: 1
        unitOfMeasure:
          maxLength: 30
          minLength: 0
          type:
          - string
          - 'null'
          description: Unit of measure.
          example: PCS
        receivedNetSum:
          type: number
          description: Net total of receiving.
          format: double
          example: 100
        receivedGrossSum:
          type: number
          description: Gross total of receiving.
          format: double
          example: 125
        receivalMethod:
          enum:
          - Quantity
          - NetSum
          - GrossSum
          type:
          - string
          - 'null'
          description: Specifies whether the receival has been done by Quantity, NetSum or GrossSum. Same receival method needs to be used for all future goods receipts done to the same order line. The receival method can only be changed by first reversing all the previously received goods receipts to the order line.
          example: Quantity
        notifyFault:
          type: boolean
          description: Used to notify supplier of damaged goods. True if goods are faulty while receiving.
          example: false
        information:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Additional information.
          example: ''
        referenceGRNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Specifies original goods receipt to be reversed (used only on reverse GR lines) Contains Basware P2P internal document number of the GR from which to substract reversed amount.
          example: ''
        referenceGRExternalCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Specifies original goods receipt to be reversed (used only on reverse GR lines) Contains external document number of the GR from which to substract reversed amount. Applicable only for GRs imported from external systems.
          example: ''
        receiver:
          $ref: '#/components/schemas/Receiver'
      additionalProperties: false
    ResponseEntityList:
      type: object
      properties:
        requestId:
          type:
          - string
          - 'null'
          description: ID of the request on which error occurred (generated by Basware API).
          example: fbc082a2-65a4-469c-b230-d84a252f18fc
        hasErrors:
          type: boolean
          description: Specifies whether the request has errors.
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorEntity'
      additionalProperties: false
      description: Errors returned here are returned synchronously from Basware API middle layer. Additional errors coming from target system(s) may be returned through errorFeedbacks API.
    Receiver:
      type: object
      properties:
        personCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Person code.
          example: '32232'
        userName:
          maxLength: 227
          minLength: 0
          type:
          - string
          - 'null'
          description: User name.
          example: Timothy Smith
        loginAccount:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Login account.
          example: company\\timsmith
        emailAddress:
          maxLength: 320
          minLength: 0
          type:
          - string
          - 'null'
          description: Email address.
          example: timothy.smith@company.com
        externalCode:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: External code.
          example: douikj327sa8d07213879
      additionalProperties: false
      description: Specifies who has received the goods.
    ExportedPurchaseOrderEntity:
      required:
      - creator
      - deliveryAddress
      - documentSource
      - externalCode
      - hidePricesFromSupplier
      - orderCreationTime
      - orderExportTimestamp
      - orderNumber
      - owner
      - processingStatus
      - releaseOrdersRequired
      - requisitionCreationTime
      - requisitionNumber
      - sendingMethod
      type: object
      properties:
        externalCode:
          maxLength: 100
          minLength: 1
          type: string
          description: External identifier that is used as a key in API.
          example: 4847-31231212-212121-1212
        orderNumber:
          maxLength: 32
          minLength: 1
          type: string
          description: Order number in Basware P2P.
          example: P2P-PO-2123682
        extOrderNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Order number in external system (for imported orders).
          example: SAP-PO-213451
        parentOrderNumber:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Used only if the order type is release to specify what is the order number of the parent blanket order in P2P Purchase.
          example: P2P-PO-2123682
        parentOrderExternalCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Used only if the order type is release to specify what is Basware API external code of the parent blanket order.
          example: 4847-31231212-212121-1212
        parentOrderExtOrderNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Used only if the order type is release to specify what is order number of the parent blanket order in the external system.
          example: SAP-PO-213451
        processingStatus:
          enum:
          - WaitingForExport
          - Exported
          type: string
          description: Processing status of the order in Basware API. Can be used for retrieving order updates which have not been acknowledged by customer. 'WaitingForExport' = Has not been acknowledged. 'Exported' = Has been acknowledged.
          example: WaitingForExport
        orderStatus:
          enum:
          - Confirmed
          - ReadyForOrder
          - Ordered
          - SupplierRejected
          - SupplierConfirmed
          - ModifiedBySupplier
          - PartiallyReceived
          - Received
          - Canceled
          - OrderCreated
          - Closed
          type: string
          description: Order status in Basware P2P Purchase.
          example: Ordered
        reasonForPendingAction:
          enum:
          - None
          - SendingFailed
          - ModifiedBySupplier
          - ModifiedByBuyer
          type: string
          description: Specifies reason for action pending for user in P2P.
          example: None
        requisitionNumber:
          maxLength: 32
          minLength: 1
          type: string
          description: Requisition number of related requisition in Basware P2P.
          example: Alusta-PR-321424
        extRequisitionNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Requisition number of related requisition in external system (for imported requisitions).
          example: SAP-PR-12321
        organizationUnitCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: P2P company  code for buyer organisation unit.
          example: BE100
        organizationUnitName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: P2P company name for buyer organisation unit.
          example: BuyerLtd
        purchasingGroupCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Purchasing group code.
          example: PG201
        purchasingGroupName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Purchasing group name.
          example: Office equipment
        purpose:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Reason why order is placed.
          example: Goods for Project A
        validityPeriodStartDate:
          type:
          - string
          - 'null'
          description: 'Used only if the order type is blanket to specify the start date for blanket purchase order validity period (date format: yyyy-MM-dd).'
          format: date-time
          example: ''
        validityPeriodEndDate:
          type:
          - string
          - 'null'
          description: 'Used only if the order type is blanket to specify the end date for blanket purchase order validity period (date format: yyyy-MM-dd).'
          format: date-time
          example: ''
        desiredDeliveryDate:
          type:
          - string
          - 'null'
          description: Delivery date requested by buyer.
          format: date-time
          example: '2020-10-24T00:00:00'
        desiredDeliveryEndDate:
          type:
          - string
          - 'null'
          description: Buyer requested latest delivery date.
          format: date-time
          example: '2020-10-24T00:00:00'
        promisedDeliveryDate:
          type:
          - string
          - 'null'
          description: Delivery date provided by supplier.
          format: date-time
          example: '2020-10-24T00:00:00'
        promisedDeliveryEndDate:
          type:
          - string
          - 'null'
          description: Supplier confirmed deliverytime.
          format: date-time
          example: '2020-10-24T00:00:00'
        classification:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Order classification code. Values are specified by customer. Often used to group orders and assign groups for handling by different persons.
          example: Project A
        cancellationNote:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Reason for cancelling order (if order is cancelled).
          example: ''
        requisitionCreationTime:
          type: string
          description: Creation time of related purchase requisition in P2P.
          format: date-time
          example: '2020-10-24T00:00:00'
        orderCreationTime:
          type: string
          description: Creation time of order in P2P.
          format: date-time
          example: '2020-10-24T00:00:00'
        orderExportTimestamp:
          type: string
          description: Export time of order to Basware API.
          format: date-time
          example: '2020-10-24T00:00:00'
        documentSource:
          enum:
          - P2P
          - ImportedAsRequisition
          - ImportedAsOrder
          type: string
          description: Specifies where the order was created (imported or created manually in P2P).
          example: P2P
        sendingMethod:
          enum:
          - BaswareNetwork
          - Email
          - SmartOrder
          type: string
          description: Determines which method Basware P2P uses to send order to supplier when the order is placed.
          example: BaswareNetwork
        salesOrderNumber:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Reference to sales order that this order relates to.
          example: ''
        documentLink:
          type:
          - string
          - 'null'
          description: URL link to view the order in Basware P2P.
          format: uri
          example: http://customertenant.p2p.basware.com/Portal/Default.aspx?forms=1&sl=1&tid=customertenant&dl=(Search/PurchaseOrderDetails-SearchOrderId(e105de8f-3e13-4487-a7e5-8c1ba12d7ea9))
        contractNumber:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Reference to contract that this order relates to.
          example: CON-1262
        orderType:
          enum:
          - Standard
          - Blanket
          - Release
          type: string
          description: "Standard order is a quantity-based purchase order. It specifies quantity amounts, prices and desired delivery dates for the items or services. \nStandard purchase orders typically require goods receipts.\n\nBlanket order is a sum-based long-term purchase order. It is placed for items or services for a specific period of time (validity period) \nand with an pre-determined maximum currency amount. Blanket orders are typically used for recurring invoices, for example ordering office cleaning \nfor one year. They can be used for ordering both services and consumable goods. Quantity amount used on the blanket order is always '1'. \nGoods receipts are not used with blanket orders.\n\nRelease orders are purchase orders that are created against/from a blanket order to authorize delivery and invoicing. If a blanket order requires \nrelease orders, the supplier should not act upon receiving the blanket order, but needs to wait for the release orders. The release orders are created \nfrom the blanket order. The release orders need no further acceptance because they are consuming an already approved blanket order. Invoicing will happen \nagainst the release orders."
          example: standard
        noteToSupplier:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Note to supplier concerning this order. This is sent to supplier when order is placed.
          example: Please deliver to 2nd floor
        noteFromSupplier:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Note received from supplier concerning this order.
          example: Will be delivered to front desk not 2nd floor
        companyCode:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: P2P company code for buyer company.
          example: BE100
        companyName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: P2P company name for buyer company.
          example: BuyerLtd
        supplierCode:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier code to whom the order is addressed.
          example: SU100
        supplierName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier name to whom the order is addressed.
          example: ACME goods and gadgets inc
        supplierContactName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Supplier contact name to whom the order is addressed.
          example: Mark Green
        supplierOrderingEmail:
          maxLength: 1800
          minLength: 0
          type:
          - string
          - 'null'
          description: The email address(es) where the order is sent to when sending order to supplier. Can contain multiple email addresses.
          example: Mark@supplier.com
        ownerOrderingEmail:
          maxLength: 1800
          minLength: 0
          pattern: ^(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*)@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          type:
          - string
          - 'null'
          description: 'Contact email to which supplier can send questions about the order. Note: When order is sent to supplier, it is not sent to this email. Note: Fields visible on the order sent to supplier are configured in P2P Purchase.'
          example: john.smith@buyer.com
        otherOrderingEmail:
          type:
          - string
          - 'null'
          description: The email address(es) where the order is sent by P2P purchase. Can contain multiple email addresses. The order is sent to these addresses when orderRecipientType is 'Owner' or 'Both'.
          example: Mark@supplier.com
        paymentTermCode:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Order payment term code.
          example: 30N
        paymentTermName:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Order payment term name.
          example: 30DaysNet
        releaseOrdersRequired:
          type: boolean
          description: Used only if the order type is blanket to specify, if the blanket order requires release orders.
          example: false
        hidePricesFromSupplier:
          type: boolean
          description: Specifies, if all price information is hidden from the supplier in the outgoing order.
          example: false
        attachPdfToNetworkOrder:
          type: boolean
          description: Specifies if order is attached as pdf file when order is sent to supplier through Basware network.
          example: true
        orderRecipientType:
          enum:
          - Supplier
          - Owner
          - SupplierAndOwner
          type: string
          description: 'Determines who order is sent to.

            -Supplier(0) : Order is sent only to supplier.

            -If orderingMethod is email, order is sent to the email indicated by ''supplierOrderingEmail''. -If orderingMethod is network, the order is sent through Basware network.

            -Owner (1): Order is sent only to email address(es) indicated by field ''otherOrderingEmail''. Used for example when goods were picked up from a store and no order needs to be sent to supplier.

            -SupplierAndOwner (2): Order is sent to both supplier and email addresses indicated by field ''otherOrderingEmail''. Order delivery method to supplier is determined by orderingMethod, same as above.'
          example: Supplier
        deliveryLocation:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Details on Delivery.
          example: ''
        deliveryTerm:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Delivery term. Generally Incoterms (International Commercial Terms) are used here, however customer and supplier can also agree to use different sets of delivery terms.
          example: Supplier to Buyer via Post
        deliveryReceiverName:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Person receiving delivery of ordered goods.
          example: SallyPetersSectetary
        purchaseCurrency:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Currency code for currency in which the order is placed.
          example: EUR
        companyCurrency:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Currency code of the company in P2P for which the order is placed.
          example: EUR
        groupCurrency:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: "Currency code of the group / organization in P2P for which the order is placed. \nThe group is a parent-level entity to the company in P2P."
          example: EUR
        exchangeRateComp:
          type:
          - number
          - 'null'
          description: Exchange rate between order currency (=purchaseCurrency) and company currency.
          format: double
          example: 1
        exchangeRateOrg:
          type:
          - number
          - 'null'
          description: Exchange rate between order currency (=purchaseCurrency) and group  currency.
          format: double
          example: 1
        grossSum:
          type: number
          description: Gross sum of order in order currency (=purchaseCurrency).
          format: double
          example: 125
        grossSumComp:
          type: number
          description: Gross sum of order in company currency.
          format: double
          example: 125
        grossSumOrg:
          type: number
          description: Gross sum of order in company currency.
          format: double
          example: 125
        netSum:
          type: number
          description: Net sum of order in order currency (=purchaseCurrency).
          format: double
          example: 100
        netSumComp:
          type: number
          description: Net sum of order in company currency.
          format: double
          example: 100
        netSumOrg:
          type: number
          description: Net sum of order in organization currency.
          format: double
          example: 100
        taxSum:
          type: number
          description: Tax sum of order in order currency (=purchaseCurrency).
          format: double
          example: 25
        taxSumComp:
          type: number
          description: Tax sum of order in company currency.
          format: double
          example: 25
        taxSumOrg:
          type: number
          description: Tax sum of order in company currency.
          format: double
          example: 25
        headerDataDate1:
          type:
          - string
          - 'null'
          description: 'HeaderDataDate1-5: Reserved for customer-specific date fields.'
          format: date-time
          example: '2020-10-24T00:00:00'
        headerDataDate2:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        headerDataDate3:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        headerDataDate4:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        headerDataDate5:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        headerDataNum1:
          type:
          - number
          - 'null'
          description: 'HeaderDataNum1-5: Can be used for customer-specific numeric fields.'
          format: double
          example: 3122
        headerDataNum2:
          type:
          - number
          - 'null'
          format: double
          example: 0
        headerDataNum3:
          type:
          - number
          - 'null'
          format: double
          example: 0
        headerDataNum4:
          type:
          - number
          - 'null'
          format: double
          example: 0
        headerDataNum5:
          type:
          - number
          - 'null'
          format: double
          example: 0
        headerDataText1:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: 'HeaderDataText1-5: Can be used for customer-specific numeric fields.'
          example: ''
        headerDataText2:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        headerDataText3:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        headerDataText4:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        headerDataText5:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lastUpdated:
          type: string
          description: Timestamp when the purchase order was last updated (from Basware P2P or from customer end).
          format: date-time
        creator:
          $ref: '#/components/schemas/Creator'
        owner:
          $ref: '#/components/schemas/Owner'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        orderLines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ExportedPurchaseOrderLineEntity'
          description: Purchase order lines.
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: Please insert basic authentication credentials into fields
      scheme: basic
    oauth2authentication:
      type: oauth2
      description: Oauth2 client credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://api.basware.com/v1/tokens
          scopes:
            accountingDocuments.read: GET accountingDocuments
            accountingDocuments.write: POST/PATCH accountingDocuments
            accountingDocuments.delete: DELETE accountingDocuments
            accounts.read: GET accounts
            accounts.write: POST/PATCH accounts
            accounts.delete: DELETE accounts
            advancedPermissions.read: GET advancedPermissions
            advancedPermissions.write: POST/PATCH advancedPermissions
            advancedPermissions.delete: DELETE advancedPermissions
            advancedValidations.read: GET advancedValidations
            advancedValidations.write: POST/PATCH advancedValidations
            advancedValidations.delete: DELETE advancedValidations
            applicationGroups.read: GET applicationGroups
            applicationGroups.write: POST/PATCH applicationGroups
            companies.read: GET companies
            companies.write: POST/PATCH companies
            contracts.delete: DELETE contracts
            contracts.read: GET contracts
            contracts.write: POST/PATCH contracts
            costCenters.read: GET costCenters
            costCenters.write: POST/PATCH costCenters
            costCenters.delete: DELETE costCenters
            errorFeedbacks.read: GET errorFeedbacks
            errorFeedbacks.write: POST/PATCH errorFeedbacks
