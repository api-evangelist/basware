openapi: 3.2.0
info:
  title: Basware APIs for Purchase-to-Pay and Master Data import…
  description: The Basware APIs documented here are for Purchase-to-Pay use cases and for importing Master Data to Basware services.
  version: v1
servers:
- url: ''
security:
- Bearer: []
- oauth2authentication: []
tags:
- name: ExportedPurchaseOrders
paths:
  /v1/exportedPurchaseOrders:
    get:
      tags:
      - ExportedPurchaseOrders
      summary: Returns purchase orders exported from Basware P2P
      description: 'Notes:

        1) This API supports sending webhook based push notifications when new data is available to be exported.

        2) This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: orderStatus
        in: query
        description: Document status filter. Returns items by order document status.
        schema:
          enum:
          - WaitingForExport
          - Exported
          type: string
      - name: pageSize
        in: query
        description: A limit for the number of items to be returned for one request. Limit can range between 1 and 100 items.
        schema:
          type: integer
          format: int32
          default: 100
      - name: companyCode
        in: query
        description: Company filter. Returns items for specific company.
        schema:
          type: string
          default: ''
      - name: lastUpdated
        in: query
        description: Date filter. Returns items that have been updated after specified date.
        schema:
          type: string
          format: date-time
      - name: x-amz-meta-continuationtoken
        in: header
        description: Used to get next page of results when item count indicated by 'pageSize' is exceeded. A token is returned in header (not body) parameter 'X-amz-meta-continuationToken' of the response whenever there are more records to fetch. Post the received value here in a new HEADER parameter on the next GET request to receive the next page of results. When getting the next page of results, you must include the same query parameters that were used when getting the first page.
        schema:
          type: string
        example: f0054d6b-f6d9-42ec-8391-7f94738dad4d
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1ExportedPurchaseOrders
      x-operation-id-source: derived
    delete:
      tags:
      - ExportedPurchaseOrders
      summary: Deletes data from Basware API. For manual one-time operations
      description: 'For manual one-time operations only, such as a manual clean-up to remove test data generated during API integration development. Only removes records from API layer.

        Deletion in target systems needs to be done separately using the data deletion mechanisms available in each of the target system in addition to deleting the data in Basware API.'
      requestBody:
        description: "Contains the body of the request.\n            Either externalCode or lastUpdated -field is required. If both values are provided, externalCode will have the priority."
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '202':
          description: RequestAccepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: BadRequest
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: deleteV1ExportedPurchaseOrders
      x-operation-id-source: derived
  /v1/exportedPurchaseOrders/{externalCode}:
    get:
      tags:
      - ExportedPurchaseOrders
      summary: Returns single exported order by externalCode - identifier
      description: 'Note: This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: externalCode
        in: path
        description: ExternalCode of the order to be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseOrdersResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1ExportedPurchaseOrdersByExternalCode
      x-operation-id-source: derived
  /v1/exportedPurchaseOrders/{externalCode}/acknowledge:
    post:
      tags:
      - ExportedPurchaseOrders
      summary: Acknowledged orders are no longer returned for next GET operation
      description: 'Notes:

        1. Updates ''processingStatus'' -field on the document to allow filtering out the document on the next GET operation

        2. For a document which is already acknowledged (processingStatus: ''Exported''), API will return 405 ''Method not allowed'' if acknowledge is attempted again on the document.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: externalCode
        in: path
        description: 'ExternalCode of the order to be acknowledged. Note: For an order which is already acknowledged, API will return 405 ''Method not allowed''.'
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to acknowledge not found.
        '405':
          description: Method not allowed. This generally happens when trying to acknowledge an exportedPurchaseOrder that is already acknowledged.
        '500':
          description: Unexpected error
      operationId: postV1ExportedPurchaseOrdersByExternalCodeAcknowledge
      x-operation-id-source: derived
components:
  schemas:
    ExportedPurchaseOrderLineEntity:
      required:
      - deliveryAddress
      - externalCode
      - grossPrice
      - grossPriceComp
      - grossPriceOrg
      - grossSum
      - grossSumComp
      - grossSumOrg
      - grossUnitPriceComp
      - grossUnitPriceOrg
      - lineType
      - netPrice
      - netPriceComp
      - netPriceOrg
      - netSum
      - netSumComp
      - netSumOrg
      - netUnitPriceComp
      - netUnitPriceOrg
      - orderLineNumber
      - priceType
      - receivingRequired
      - taxTotal
      - taxTotalComp
      - taxTotalOrg
      type: object
      properties:
        externalCode:
          maxLength: 100
          minLength: 1
          type: string
          description: "Unique external identifier that is used as a key in API. \nIdentifies order line for updates through API."
          example: 060cb8ea-5464-11ea-a38b-2e728ce88123
        orderLineNumber:
          type: integer
          description: Order line number in Basware P2P.
          format: int32
          example: 1
        extOrderLineNumber:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Order line number in customer system (for imported orders).
          example: '1'
        parentOrderLineExternalCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Used only if the order type on headers is release. Contains a line-level reference to the parent blanket order line, from which the release order line was released.
          example: 4847-31231212-212121-1212
        lineStatus:
          enum:
          - ReadyForOrder
          - Ordered
          - SupplierRejected
          - SupplierConfirmed
          - PartiallyReceived
          - Received
          - Canceled
          - Deleted
          - AttachedToOrder
          - Closed
          type: string
          description: Status of order line in Basware P2P.
          example: Ordered
        cancellationNote:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Reason for cancelling order line (if line  is cancelled).
          example: ''
        categoryCode:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Category code linked to product.
          example: '007'
        categoryName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Category name linked to product.
          example: IT
        buyerProductCode:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Product code used by buyer.
          example: '1239873'
        supplierProductCode:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: Product code used by supplier.
          example: '126587213'
        supplierProductName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Product name used by supplier.
          example: External USB3 hard drive, 1Tb
        manufacturerProductCode:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Manufacturer product code is an identification number supplied by a manufacturer to uniquely identify products that aren't easily distinquishable from one another. It allows consumers to search for the exact product they need without any technical knowledge. Commonly used for example with automotive or electronics replacement parts. Required P2P 23.10 or later.
          example: ManufacturerProductCode
        description:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Product description.
          example: 1Tb external hard disk
        leadTime:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Specifies how soon after receiving order the supplier usually is able to deliver the goods. Informative field.
          example: ''
        desiredDeliveryDate:
          type:
          - string
          - 'null'
          description: Delivery date requested by buyer.
          format: date-time
          example: '2020-10-24T00:00:00'
        desiredDeliveryEndDate:
          type:
          - string
          - 'null'
          description: Buyer requested end date for delivery.
          format: date-time
          example: '2020-10-24T00:00:00'
        promisedDeliveryDate:
          type:
          - string
          - 'null'
          description: Delivery date provided by supplier.
          format: date-time
          example: '2020-10-24T00:00:00'
        promisedDeliveryEndDate:
          type:
          - string
          - 'null'
          description: Delivery end date provided by supplier.
          format: date-time
          example: '2020-10-24T00:00:00'
        deliveryTerm:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Delivery term.
          example: Supplier to Buyer via Post
        allowPartialDeliveries:
          type: boolean
          description: Specifies if partial deliveries are allowed. true = allowed, false = not allowed.
          example: false
        noteFromSupplier:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Note received from supplier concerning order line.
          example: ''
        noteToSupplier:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Note sent to supplier concerning this order line. Sent to supplier when order is placed.
          example: ''
        additionalInfo:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: Contains data from custom fields in free-text ordering forms.
          example: ''
        receivingRequired:
          type: boolean
          description: "Specifies if receiving is required on this order line. \nTrue - User needs to receive the order line in Purchase (receival task created for user)\nFalse - User does not need to receive the order line in Purchase (no receival task created)"
          example: true
        receiveAutomatically:
          type: boolean
          description: "Specifies if order line will be received automatically. \nTrue - Order line will be automatically received(no user input required)\nFalse - Order line will not be automatically received."
          example: false
        quoteReference:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: Reference to quote related to order line.
          example: Q1873
        deliveryInstruction:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Delivery instruction for supplier.
          example: Requires delivery between 12:00-16:00
        plant:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Plant.
          example: ''
        storageLocation:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Storage location.
          example: ''
        unspsc:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
          description: Product classification code (UNSPC).
          example: ''
        grNote:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Note for receiving goods.
          example: ''
        lineType:
          enum:
          - Catalog
          - FreeText
          - Punchout
          - CostLine
          - Marketplace
          type: string
          description: Specifies how the order line got created - from cataloque, freeText, marketplace, etc.
          example: Catalog
        lineDataDate1:
          type:
          - string
          - 'null'
          description: LineDataDate1-5 can be used for customer-specific date fields. These fields are from ‘Line data’ -tab of the order line in P2P.
          format: date-time
          example: '2020-10-24T00:00:00'
        lineDataDate2:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        lineDataDate3:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        lineDataDate4:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        lineDataDate5:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        lineDataNum1:
          type:
          - string
          - 'null'
          description: LineDataNum1-5 can be used for customer-specific numeric fields. These fields are from ‘Line data’ -tab of the order line in P2P.
          example: '32123'
        lineDataNum2:
          type:
          - string
          - 'null'
          example: ''
        lineDataNum3:
          type:
          - string
          - 'null'
          example: ''
        lineDataNum4:
          type:
          - string
          - 'null'
          example: ''
        lineDataNum5:
          type:
          - string
          - 'null'
          example: ''
        lineDataText1:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: LineDataText1-5 can be used for customer-specific text fields. These fields are from ‘Line data’ -tab of the order line in P2P.
          example: ''
        lineDataText2:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText3:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText4:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        lineDataText5:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          example: ''
        quantity:
          type:
          - number
          - 'null'
          description: Ordered quantity.
          format: double
          example: 1
        quantityUnit:
          maxLength: 10
          minLength: 0
          type:
          - string
          - 'null'
          description: Unit code for ordered quantity (pcs, kg, litre, boxes, etc).
          example: PCS
        quantityUnitName:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Description for quantityUnit.
          example: Pieces
        receivedNetSum:
          type:
          - number
          - 'null'
          description: Total net sum received. This is added up from goods receipts done to the order line.
          format: double
          example: 100
        receivedGrossSum:
          type:
          - number
          - 'null'
          description: Total gross sum received. This is added up from goods receipts done to the order line.
          format: double
          example: 125
        receivedQuantity:
          type:
          - number
          - 'null'
          description: Total quantity received. This is added up from goods receipts done to the order line.
          format: double
          example: 1
        receivalMethod:
          enum:
          - Quantity
          - NetSum
          - GrossSum
          type:
          - string
          - 'null'
          description: "Specifies whether the receival has been done by Quantity, NetSum or GrossSum. Same receival method is used for all goods receipts done to the same order line. If the first goods receipt has been done through P2P Purchase UI, that will determine the receival method expected on any future goods receipts (also those imported through API). If all the previously goods receipts for the row have been also reversed, then the receival method can be chosen again. \n\nNote that this field can change it's value, for example:\n* First export without GRs: Value is null.\n* Second export with GRs received by quantity: Value is Quantity.\n* Third export with previous GRs reversed: Value is null.\n* Fourth export with new GRs received by NetSum: Value is NetSum."
          example: Quantity
        priceType:
          enum:
          - Net
          - Gross
          type: string
          description: Specified whether price been originally net or gross.
          example: gross
        subUom:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Sub unit of measure.
          example: ''
        refundLine:
          type:
          - boolean
          - 'null'
          description: "Specifies whether the line is a refund line. \nTrue = refund line, false = not a refund line."
          example: false
        discountPercent:
          type:
          - number
          - 'null'
          description: Percentage of discount on order line.
          format: double
          example: 10
        discountPercentReason:
          maxLength: 250
          minLength: 0
          type:
          - string
          - 'null'
          description: Reason for discount.
          example: ''
        grossSum:
          type: number
          description: Gross sum in purchasing currency (including discount).
          format: double
          example: 125
        grossSumComp:
          type: number
          description: Gross sum in company currency (including discount).
          format: double
          example: 125
        grossSumOrg:
          type: number
          description: Gross sum in organization currency (including discount).
          format: double
          example: 125
        netSum:
          type: number
          description: Net sum in purchasing currency (including discount).
          format: double
          example: 100
        netSumComp:
          type: number
          description: Net sum in company currency (including discount).
          format: double
          example: 100
        netSumOrg:
          type: number
          description: Net sum in organization currency (including discount).
          format: double
          example: 100
        tax1Sum:
          type:
          - number
          - 'null'
          description: Tax sum 1  in purchasing currency.
          format: double
          example: 25
        tax1SumComp:
          type:
          - number
          - 'null'
          description: Tax sum 1  in company currency.
          format: double
          example: 25
        tax1SumOrg:
          type:
          - number
          - 'null'
          description: Tax sum 1  in organization currency.
          format: double
          example: 25
        tax2Sum:
          type:
          - number
          - 'null'
          description: Tax sum 2 in purchasing currency.
          format: double
          example: 0
        tax2SumComp:
          type:
          - number
          - 'null'
          description: Tax sum 2  in company currency.
          format: double
          example: 0
        tax2SumOrg:
          type:
          - number
          - 'null'
          description: Tax sum 2  in organization currency.
          format: double
          example: 0
        taxTotal:
          type: number
          description: Total tax sum in purchasing currency.
          format: double
          example: 25
        taxTotalComp:
          type: number
          description: Total tax sum in company currency.
          format: double
          example: 25
        taxTotalOrg:
          type: number
          description: Total tax sum in organization currency.
          format: double
          example: 25
        taxCategory:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Tax category.
          example: ''
        taxCode:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Tax code.
          example: T25
        taxJurisdictionCode:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Tax juristiction code.
          example: ''
        taxPercent:
          type:
          - number
          - 'null'
          description: Tax percent 1.
          format: double
          example: 25
        taxPercent2:
          type:
          - number
          - 'null'
          description: Tax percent 2.  Can be used for example for handling reverse charges on EU VAT.
          format: double
          example: 0
        grossUnitPrice:
          type:
          - number
          - 'null'
          description: Gross unit price in purchasing currency (without discount).
          format: double
          example: 125
        grossUnitPriceComp:
          type: number
          description: Gross unit price in company currency (without discount).
          format: double
          example: 125
        grossUnitPriceOrg:
          type: number
          description: Gross unit price in organization currency (without discount).
          format: double
          example: 125
        netPrice:
          type: number
          description: Net unit price in purchasing currency (with discount).
          format: double
          example: 100
        netPriceComp:
          type: number
          description: Net unit price in company currency (with discount).
          format: double
          example: 100
        netPriceOrg:
          type: number
          description: Net unit price in organization currency (with discount).
          format: double
          example: 100
        grossPrice:
          type: number
          description: Gross unit price in purchasing currency (with discount).
          format: double
          example: 125
        grossPriceComp:
          type: number
          description: Gross unit price in company currency (with discount).
          format: double
          example: 125
        grossPriceOrg:
          type: number
          description: Gross unit price in organization currency (with discount).
          format: double
          example: 125
        netUnitPrice:
          type:
          - number
          - 'null'
          description: Net unit price in purchasing currency (without discount).
          format: double
          example: 100
        netUnitPriceComp:
          type: number
          description: Net unit price in organization currency (without discount).
          format: double
          example: 100
        netUnitPriceOrg:
          type: number
          description: Net unit price in company currency (without discount).
          format: double
          example: 100
        conversionNumerator:
          type:
          - number
          - 'null'
          description: Factor for conversions.
          format: double
        conversionDenumerator:
          type:
          - number
          - 'null'
          description: Factor for conversions.
          format: double
        materialGroup:
          maxLength: 100
          minLength: 0
          type:
          - string
          - 'null'
          description: Material group.
          example: ''
        linePricingDate1:
          type:
          - string
          - 'null'
          description: LinePricingDate1-5 can be used for customer-specific date fields. These fields are from ‘Pricing’ -tab of the order line in P2P.
          format: date-time
          example: ''
        linePricingDate2:
          type:
          - string
          - 'null'
          format: date-time
          example: ''
        linePricingDate3:
          type:
          - string
