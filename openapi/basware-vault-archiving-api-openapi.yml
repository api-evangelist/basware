openapi: 3.0.2
info:
  title: Basware OAUTH2 authentication APIs AccountingDocuments Vault Archiving API
  description: "**Using OAUTH2.0 authentication:**\n\nGet API access token from api.basware.com/tokens\n1. Using client id and client secret, which you can obtain from Basware. \n2. Specify which APIs can be accessed by using the token e.g. Read only access to vendors API only (these are called scopes). Available scopes are listed at <https://developer.basware.com/api/p2p/manual#AccessRights>. \n3. Each token has an expiration time, until which it can be used to call APIs.\n\nWhen using OAUTH2 authentication, you need to pass the OAUTH2 authentication token when calling Basware API endpoints. Available Basware API operations are documented at <https://api.basware.com/swagger>. \n\nSee the Basware API developer site at <https://developer.basware.com/api/p2p/manual#Authentication> for more details on API authentication."
  version: 1.0.0
  x-logo:
    url: https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png
tags:
- name: Vault Archiving
paths:
  /vaults/{vaultId}/documents:
    post:
      tags:
      - Vault Archiving
      summary: Send the document metadata for archiving and receive pre-signed URL to upload document ZIP file.
      operationId: postArchivedDocument
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: path
        name: vaultId
        description: Vault ID to be posted to
        required: true
        type: string
      - in: body
        name: body
        description: Metadata of the document.
        required: true
        schema:
          type: array
          items:
            $ref: '#/definitions/ArchivedDocument'
      responses:
        '200':
          description: Successful operation.
          schema:
            type: array
            items:
              $ref: '#/definitions/ArchivedDocumentResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
  /{pre-signed URL}:
    put:
      tags:
      - Vault Archiving
      summary: Upload the document ZIP file to be archived using a pre-signed URL.
      operationId: putArchivedDocument
      consumes:
      - multipart/form-data
      produces:
      - application/json
      parameters:
      - in: path
        name: pre-signed URL
        description: URL where to PUT the file. Use the pre-signed URL returned from POST request. Uses a different domain from api.basware.com.
        required: true
        type: string
      - in: formData
        name: file
        description: ZIP archive containing file(s) to be archived related to the document.
        required: true
        type: file
      responses:
        '200':
          description: Successful operation.
        '400':
          description: Invalid request
  /vaults/{vaultId}/documents/status:
    get:
      tags:
      - Vault Archiving
      summary: Returns the status of archived documents. Response limited to 500 most recent documents.
      operationId: getArchiveStatuses
      produces:
      - application/json
      parameters:
      - in: path
        name: vaultId
        description: Vault ID to be checked from
        required: true
        type: string
      responses:
        '200':
          description: Successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/ArchivedDocumentStatusResponse'
        '400':
          description: Invalid request
        '403':
          description: Forbidden
      deprecated: false
  /vaults/{vaultId}/documents/{bumid}/status:
    get:
      tags:
      - Vault Archiving
      summary: Return archival status a document.
      operationId: getArchiveStatusWithID
      produces:
      - application/json
      parameters:
      - name: bumid
        in: path
        description: Unique identifier of the document. Issued by Basware. BUMID must belong to user.
        required: true
        type: string
      - in: path
        name: vaultId
        description: Vault ID to be checked from
        required: true
        type: string
      responses:
        '200':
          description: Successful operation.
          schema:
            $ref: '#/definitions/ArchivedDocumentStatusResponse'
        '400':
          description: Invalid request
        '404':
          description: Not found. Typically returned when no document was found using the bumId.
        '403':
          description: Forbidden
      deprecated: false
components:
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
definitions:
