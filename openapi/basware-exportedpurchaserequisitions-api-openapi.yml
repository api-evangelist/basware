openapi: 3.2.0
info:
  title: Basware APIs for Purchase-to-Pay and Master Data import…
  description: The Basware APIs documented here are for Purchase-to-Pay use cases and for importing Master Data to Basware services.
  version: v1
servers:
- url: ''
security:
- Bearer: []
- oauth2authentication: []
tags:
- name: ExportedPurchaseRequisitions
paths:
  /v1/exportedPurchaseRequisitions:
    get:
      tags:
      - ExportedPurchaseRequisitions
      summary: Returns purchase requisitions exported fom Basware P2P
      description: 'Notes:

        1) A purchase requisition is exported from P2P when the requisition is approved, rejected or canceled. Requisitions are not exported while they are in approval process.

        2) This API supports sending webhook based push notifications when new data is available to be exported.

        3) This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: status
        in: query
        description: Document status filter. Returns items by order document status.
        schema:
          enum:
          - WaitingForExport
          - Exported
          type: string
      - name: pageSize
        in: query
        description: A limit for the number of items to be returned for one request. Limit can range between 1 and 100 items.
        schema:
          type: integer
          format: int32
          default: 100
      - name: companyCode
        in: query
        description: Company filter. Returns items for specific company.
        schema:
          type: string
          default: ''
      - name: lastUpdated
        in: query
        description: Date filter. Returns items that have been updated after specified date.
        schema:
          type: string
          format: date-time
      - name: x-amz-meta-continuationtoken
        in: header
        description: Used to get next page of results when item count indicated by 'pageSize' is exceeded. A token is returned in header (not body) parameter 'X-amz-meta-continuationToken' of the response whenever there are more records to fetch. Post the received value here in a new HEADER parameter on the next GET request to receive the next page of results. When getting the next page of results, you must include the same query parameters that were used when getting the first page.
        schema:
          type: string
        example: 1093edb3-7620-4986-b46b-985c3f9addd4
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1ExportedPurchaseRequisitions
      x-operation-id-source: derived
    delete:
      tags:
      - ExportedPurchaseRequisitions
      summary: Deletes data from Basware API. For manual one-time operations
      description: 'For manual one-time operations only, such as a manual clean-up to remove test data generated during API integration development. Only removes records from API layer.

        Deletion in target systems needs to be done separately using the data deletion mechanisms available in each of the target system in addition to deleting the data in Basware API.'
      requestBody:
        description: "Contains the body of the request.\n            Either externalCode or lastUpdated -field is required. If both values are provided, externalCode will have the priority."
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '202':
          description: RequestAccepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: BadRequest
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: deleteV1ExportedPurchaseRequisitions
      x-operation-id-source: derived
  /v1/exportedPurchaseRequisitions/{externalCode}:
    get:
      tags:
      - ExportedPurchaseRequisitions
      summary: Returns a single purchase requisition by external code - identifier
      description: 'Note: This GET operation returns a HTTP redirect, which the API client needs to follow.

        * ''Authorization'' header must not be included in the redirected request (the second request after receiving a redirect).

        * ''Host'' header needs to be included.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: externalCode
        in: path
        description: ExternalCode of the requisition to be retrieved.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ExportedPurchaseRequisitionsResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
      operationId: getV1ExportedPurchaseRequisitionsByExternalCode
      x-operation-id-source: derived
  /v1/exportedPurchaseRequisitions/{externalCode}/acknowledge:
    post:
      tags:
      - ExportedPurchaseRequisitions
      summary: Acknowledged requisitions are no longer returned for next GET operation
      description: 'Notes:

        1. Updates ''processingStatus'' -field on the document to allow filtering out the document on the next GET operation

        2. For a document which is already acknowledged (processingStatus: ''Exported''), API will return 405 ''Method not allowed'' if acknowledge is attempted again on the document.


        Please see section "Usage scenario 4: Import and export procurement data" for details on implementing this API.'
      parameters:
      - name: externalCode
        in: path
        description: 'External Code of the purchase requisition to be acknowledged. Note: For a purchase requisition which is already acknowledged, API will return 405 ''Method not allowed''.'
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '405':
          description: Method not allowed. This generally happens when trying to acknowledge an exportedPurchaseRequisition that is already acknowledged.
        '500':
          description: Unexpected error
      operationId: postV1ExportedPurchaseRequisitionsByExternalCodeAcknowledge
      x-operation-id-source: derived
