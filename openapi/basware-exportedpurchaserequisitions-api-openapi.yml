    ErrorEntity:
      type: object
      properties:
        externalCode:
          type: string
          description: External code of record on which error occurred (when available).
          nullable: true
          example: 4847-31231212-212121-1212
        type:
          enum:
          - BUSINESS
          - VALIDATION
          - TECHNICAL
          - SECURITY
          type: string
          description: Error type.
          example: ''
        code:
          enum:
          - EXTERNAL_CODE_MISMATCH
          - SCHEMA_VALIDATION_ERROR
          - CONFLICT_IN_POST
          - DATA_ORIGIN_VALIDATION_ERROR
          - ACCESS_TOKEN_VALIDATION_ERROR
          - CREDENTIAL_VALIDATION_ERROR
          - PARAMETER_VALIDATION_ERROR
          - UNEXPECTED_ERROR
          - METHOD_NOT_ALLOWED
          - ENTITY_NOT_FOUND
          - DATA_VALIDATION_FAILED
          - SNS_PUBLISH_ERROR
          - SQS_PUBLISH_ERROR
          type: string
          description: Error code.
          example: ''
        message:
          type: string
          description: Specific error message.
          nullable: true
          example: ''
        info:
          type: string
          description: Information about type of the error.
          nullable: true
          example: ''
      additionalProperties: false
    ExportedPurchaseRequisitionsResponse:
      required:
      - exportedPurchaseRequisitions
      type: object
      properties:
        exportedPurchaseRequisitions:
          type: array
          items:
            $ref: '#/components/schemas/ExportedPurchaseRequisitionEntity'
      additionalProperties: false
    ExportedPurchaseRequisitionEntity:
      required:
      - companyCode
      - companyCurrency
      - companyName
      - creator
      - deliveryAddress
      - exchangeRateComp
      - exchangeRateOrg
      - externalCode
      - grossSum
      - grossSumComp
      - grossSumOrg
      - groupCurrency
      - netSum
      - netSumComp
      - netSumOrg
      - organizationUnitCode
      - organizationUnitName
      - owner
      - processingStatus
      - purchaseCurrency
      - requisitionCreationTime
      - requisitionExportTimestamp
      - requisitionNumber
      - taxSum
      - taxSumComp
      - taxSumOrg
      type: object
      properties:
        externalCode:
          maxLength: 100
          minLength: 1
          type: string
          description: External identifier that is used as a key in API for the requisition.
          example: be84e5ba6ad748bebbe8a5a10146e685da
        requisitionNumber:
          maxLength: 32
          minLength: 1
          type: string
          description: Requisition number in Basware P2P.
          example: Alusta-PR-100
        extRequisitionNumber:
          maxLength: 100
          minLength: 0
          type: string
          description: Requisition number in external system (for imported requisitions).
          nullable: true
          example: SAP-PR-100
        extOrderNumber:
          maxLength: 100
          minLength: 0
          type: string
          description: Order number in external system (for imported orders).
          nullable: true
          example: SAP-PO-100
        requisitionStatus:
          enum:
          - Approved
          - Canceled
          - Rejected
          type: string
          description: Status of the requisition in Basware P2P.
          example: Approved
        processingStatus:
          enum:
          - WaitingForExport
          - Exported
          type: string
          description: Processing status of exported purchase requisition in Basware API. WaitingForExport = New requisition data (not acknowledged), which is waiting to be fetched. Exported = This requisition has been acknowledged by customer system.
          example: WaitingForExport
        companyCode:
          maxLength: 25
          minLength: 1
          type: string
          description: P2P company code name for buyer company.
          example: BE100
        companyName:
          maxLength: 250
          minLength: 1
          type: string
          description: P2P company name for buyer company.
          example: BuyerLtd
        organizationUnitCode:
          maxLength: 25
          minLength: 1
          type: string
          description: P2P company  code for buyer organisation unit.
          example: BE100
        organizationUnitName:
          maxLength: 250
          minLength: 1
          type: string
          description: P2P company name for buyer organisation unit.
          example: Buyer Ltd
        purchasingGroupCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Purchasing group code.
          nullable: true
          example: PG201
        purchasingGroupName:
          maxLength: 250
          minLength: 0
          type: string
          description: Purchasing group name.
          nullable: true
          example: Office equipment
        purpose:
          maxLength: 2000
          minLength: 0
          type: string
          description: Reason why order is placed (text description).
          nullable: true
          example: Goods for Project A
        desiredDeliveryDate:
          type: string
          description: Delivery date requested by buyer.
          format: date-time
          nullable: true
          example: '2020-10-24T00:00:00'
        desiredDeliveryEndDate:
          type: string
          description: Buyer requested latest delivery date.
          format: date-time
          nullable: true
          example: '2020-10-24T00:00:00'
        deliveryInstructions:
          maxLength: 250
          minLength: 0
          type: string
          description: Delivery instructions for supplier.
          nullable: true
          example: Delivery required between 10AM-4PM.
        classification:
          maxLength: 250
          minLength: 0
          type: string
          description: Requisition classification code (values specified by customer). Often used to group requisitions and assign different groups to be handled to different persons.
          nullable: true
          example: Group F
        requisitionCreationTime:
          type: string
          description: Creation time of the requisition in P2P.
          format: date-time
          example: '2020-10-24T00:00:00'
        requisitionExportTimestamp:
          type: string
          description: Timestamp when the requisition was exported from P2P to Basware API.
          format: date-time
          example: '2020-10-24T00:00:00'
        documentSource:
          enum:
          - P2P
          - ImportedAsRequisition
          - ImportedAsOrder
          type: string
          description: States whether the requisition was created in P2P or imported from external system.
          example: P2P
        documentLink:
          type: string
          description: URL link to view the requisition in Basware P2P.
          format: uri
          nullable: true
          example: http://customertenant.p2p.basware.com/Portal/Default.aspx?forms=1&sl=1&tid=customertenant&dl=(RequisitionDetailsPage-requisitionid((e105de8f-3e13-4487-a7e5-8c1ba12d7ea9))
        purchaseCurrency:
          maxLength: 25
          minLength: 1
          type: string
          description: Currency code for currency in which the requisition is placed.
          example: EUR
        companyCurrency:
          maxLength: 25
          minLength: 1
          type: string
          description: Currency code of the company in P2P for which the requisition is placed.
          example: EUR
        groupCurrency:
          maxLength: 25
          minLength: 1
          type: string
          description: "Currency code of the group / organization in P2P for which the requisition is placed. \r\nThe group is a parent-level entity to the company in P2P."
          example: EUR
        exchangeRateComp:
          type: number
          description: Exchange rate between requisition currency (=purchaseCurrency) and company currency.
          format: double
          example: 1
        exchangeRateOrg:
          type: number
          description: Exchange rate between requisition currency (=purchaseCurrency) and group  currency.
          format: double
          example: 1
        grossSum:
          type: number
          description: Gross sum of requisition in requisition currency (purchaseCurrency).
          format: double
          example: 125
        grossSumComp:
          type: number
          description: Gross sum of requisition in company currency.
          format: double
          example: 125
        grossSumOrg:
          type: number
          description: Gross sum of requisition in company currency.
          format: double
          example: 125
        netSum:
          type: number
          description: Net sum of requisition in requisition currency (purchaseCurrency).
          format: double
          example: 100
        netSumComp:
          type: number
          description: Net sum of requisition in company currency.
          format: double
          example: 100
        netSumOrg:
          type: number
          description: Net sum of requisition in company currency.
          format: double
          example: 100
        taxSum:
          type: number
          description: Tax sum of requisition in requisition currency (purchaseCurrency).
          format: double
          example: 25
        taxSumComp:
          type: number
          description: Tax sum of requisition in company currency.
          format: double
          example: 25
        taxSumOrg:
          type: number
          description: Tax sum of requisition in company currency.
          format: double
          example: 25
        headerDataDate1:
          type: string
          description: 'HeaderDataDate1-5: Can be used for for customer-specific date fields.'
          format: date-time
          nullable: true
        headerDataDate2:
          type: string
          format: date-time
          nullable: true
        headerDataDate3:
          type: string
          format: date-time
          nullable: true
        headerDataDate4:
          type: string
          format: date-time
          nullable: true
        headerDataDate5:
          type: string
          format: date-time
          nullable: true
        headerDataNum1:
          type: number
          description: 'HeaderDataNum1-5: Can be used for for customer-specific numeric fields.'
          format: double
          nullable: true
          example: 2264
        headerDataNum2:
          type: number
          format: double
          nullable: true
          example: 0
        headerDataNum3:
          type: number
          format: double
          nullable: true
          example: 0
        headerDataNum4:
          type: number
          format: double
          nullable: true
          example: 0
        headerDataNum5:
          type: number
          format: double
          nullable: true
          example: 0
        headerDataText1:
          maxLength: 250
          minLength: 0
          type: string
          description: 'HeaderDataText1-5: Can be used for for customer-specific text fields.'
          nullable: true
          example: ''
        headerDataText2:
          maxLength: 250
          minLength: 0
          type: string
          nullable: true
          example: ''
        headerDataText3:
          maxLength: 250
          minLength: 0
          type: string
          nullable: true
          example: ''
        headerDataText4:
          maxLength: 250
          minLength: 0
          type: string
          nullable: true
          example: ''
        headerDataText5:
          maxLength: 250
          minLength: 0
          type: string
          nullable: true
          example: ''
        lastUpdated:
          type: string
          description: Timestamp when the purchase order was last updated (from Basware P2P or from customer end).
          format: date-time
        creator:
          $ref: '#/components/schemas/Creator'
        owner:
          $ref: '#/components/schemas/Owner'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ExportedPurchaseRequisitionLineEntity'
          nullable: true
        orderGrouping:
          type: array
          items:
            $ref: '#/components/schemas/OrderGrouping'
          description: Specifies how the requisition lines will be grouped by P2P into orders (according to grouping criteria).
          nullable: true
      additionalProperties: false
    Owner:
      type: object
      properties:
        personCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Person code.
          nullable: true
          example: '22110'
        userName:
          maxLength: 227
          minLength: 0
          type: string
          description: User name.
          nullable: true
          example: Liz Green
        loginAccount:
          maxLength: 100
          minLength: 0
          type: string
          description: Login account.
          nullable: true
          example: company\\lizgreen
        emailAddress:
          maxLength: 320
          minLength: 0
          pattern: ^(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21\x23-\x5b\x5d-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])*)@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\x01-\x08\x0b\x0c\x0e-\x1f\x21-\x5a\x53-\x7f]|\\[\x01-\x09\x0b\x0c\x0e-\x7f])+)\])$
          type: string
          description: Email address.
          nullable: true
          example: liz.green@company.com
        externalCode:
          maxLength: 50
          minLength: 0
          type: string
          description: External code.
          nullable: true
          example: 908123lkhjhdsai213io7
      additionalProperties: false
      description: Specifies owner for the order / requisition. Owner is by default same person as creator, unless manually changed.
    ResponseEntityList:
      type: object
      properties:
        requestId:
          type: string
          description: ID of the request on which error occurred (generated by Basware API).
          nullable: true
          example: fbc082a2-65a4-469c-b230-d84a252f18fc
        hasErrors:
          type: boolean
          description: Specifies whether the request has errors.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
          nullable: true
      additionalProperties: false
      description: Errors returned here are returned synchronously from Basware API middle layer. Additional errors coming from target system(s) may be returned through errorFeedbacks API.
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
