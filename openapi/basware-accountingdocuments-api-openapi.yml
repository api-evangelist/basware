          type: string
          description: Information about type of the error.
          nullable: true
          example: ''
      additionalProperties: false
    PaymentResponseEntity:
      required:
      - externalCode
      - paymentBlock
      - success
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: External identifier that is used as a key in API. External code of the paymentResponse needs to be unique within an accountingDocument -record. You should always create a new externalCode when sending response, there is no overwriting/editing of previous response. This will enable the visibility that all responses are tracked in API. ExternalCode in response messages plays no role in P2P (other than it is used in communication between P2P and the API layer).
          example: f24fff19120445de9c23651434129991
        success:
          type: boolean
          description: Indicates a succesful response from ERP. Needs to be 'true' for P2P to update invoice data field contents.
          example: true
        responseMessage:
          maxLength: 250
          minLength: 0
          type: string
          description: This message is stored to P2P invoice action log.
          nullable: true
          example: Invoice Paid.
        sourceSystem:
          maxLength: 32
          minLength: 0
          type: string
          description: Indicates the system that is returning payment response.
          nullable: true
          example: ERP1
        paymentDate:
          type: string
          description: Date when the invoice was paid can be updated here.
          format: date-time
          nullable: true
        paymentTermCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Invoice payment term code can be updated here.
          nullable: true
          example: 7D2-NT30
        paymentBlock:
          type: boolean
          description: Payment block.
          example: false
        paymentMethod:
          maxLength: 25
          minLength: 0
          type: string
          description: Payment method can be updated here.
          nullable: true
          example: BankTransfer
        paidTotal:
          type: number
          description: Total amount paid for the invoice so far. For partial payments, this value will increase each time more of the invoice is paid.
          format: double
          nullable: true
          example: 1136.8
        cashDiscount:
          type: number
          description: discount amount can be updated here.
          format: double
          nullable: true
          example: 23.2
        checkNumber:
          maxLength: 25
          minLength: 0
          type: string
          description: Unique identifier from the check used in payment transaction.
          nullable: true
          example: '123456012'
        paymentMessage:
          maxLength: 100
          minLength: 0
          type: string
          description: Payment message can be updated here.
          nullable: true
          example: ''
        paymentNumber:
          maxLength: 250
          minLength: 0
          type: string
          description: Payment number can be updated here.
          nullable: true
          example: 122447-55257552
        paymentDocument:
          maxLength: 250
          minLength: 0
          type: string
          description: Payment document number can be updated here.
          nullable: true
          example: '873326806'
        paymentReversalDocument:
          maxLength: 250
          minLength: 0
          type: string
          description: Payment reversal document can be updated here.
          nullable: true
          example: '873326806'
      additionalProperties: false
    ResponseEntityList:
      type: object
      properties:
        requestId:
          type: string
          description: ID of the request on which error occurred (generated by Basware API).
          nullable: true
          example: fbc082a2-65a4-469c-b230-d84a252f18fc
        hasErrors:
          type: boolean
          description: Specifies whether the request has errors.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntity'
          nullable: true
      additionalProperties: false
      description: Errors returned here are returned synchronously from Basware API middle layer. Additional errors coming from target system(s) may be returned through errorFeedbacks API.
    AccountingDocumentsStatusResponseEntity:
      type: object
      properties:
        invoiceId:
          type: string
          description: Basware internal identifier for the invoice. Can be used to query invoice details from accountingDocuments API.
          nullable: true
          example: fbc082a265a4469cb230d84a252f18fc
        status:
          enum:
          - InApprovalProcess
          - ReadyForPayment
          - Paid
          - Rejected
          type: string
          description: "High level status of the invoice.\r\n* InApprovalProcess - Invoice has been received in Basware P2P and is being processed. This includes all invoice statuses before succesful transfer to ERP.\r\n* ReadyForPayment - Invoice is approved for payment and has been transferred to ERP system.\r\n* Paid - Invoice has been paid.\r\n* Rejected - Invoice has been rejected."
          example: InApprovalProcess
        processingStatus:
          enum:
          - WaitingForPrebook
          - PrebookInProgress
          - Prebooked
          - PrebookFailed
          - WaitingForTransfer
          - TransferInProgress
          - Transferred
          - TransferFailed
          - WaitingForPrebookCancelation
          - PrebookCancelationInProgress
          - PrebookCanceled
          - PrebookCancelFailed
          - WaitingToBeRemoved
          - Removed
          - RemoveFailed
          - WaitingToBeReturned
          - Returned
          - ReturnFailed
          - WaitingToBeCompleted
          - CompletionInProgress
          - Completed
          - CompletionFailed
          - Paid
          - New
          - WaitingForEnrichmentTransfer
          - EnrichmentTransferInProgress
          - EnrichmentTransferred
          - EnrichmentTransferFailed
          - InDocumentFilter
          - DocumentFilterReleased
          type: string
          description: API processing status of the invoice (from accountingDocuments API).
          example: New
        disputeInfo:
          $ref: '#/components/schemas/DisputeInfo'
        lastUpdated:
          type: string
          description: Timestamp when the invoice record was last updated (from Basware P2P or from customer end).
          format: date-time
      additionalProperties: false
      description: ''
    RemoveResponseEntity:
      required:
      - externalCode
      - responseMessage
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 2
          type: string
          description: External identifier
          example: dd79ba5612a744bf9a92333fe14a6aef
        success:
          type: boolean
          description: Identifies if the invoice was succesfully removed
          nullable: true
          example: false
