        value:
          maxLength: 250
          minLength: 1
          type: string
          example: ca7f0c603388437ea9584446e26cf01c
      additionalProperties: false
    AccountingDocumentsStatusResponseEntity:
      type: object
      properties:
        invoiceId:
          type:
          - string
          - 'null'
          description: Basware internal identifier for the invoice. Can be used to query invoice details from accountingDocuments API.
          example: fbc082a265a4469cb230d84a252f18fc
        status:
          enum:
          - InApprovalProcess
          - ReadyForPayment
          - Paid
          - Rejected
          type: string
          description: 'High level status of the invoice.

            * InApprovalProcess - Invoice has been received in Basware P2P and is being processed. This includes all invoice statuses before succesful transfer to ERP.

            * ReadyForPayment - Invoice is approved for payment and has been transferred to ERP system.

            * Paid - Invoice has been paid.

            * Rejected - Invoice has been rejected.'
          example: InApprovalProcess
        processingStatus:
          enum:
          - WaitingForPrebook
          - PrebookInProgress
          - Prebooked
          - PrebookFailed
          - WaitingForTransfer
          - TransferInProgress
          - Transferred
          - TransferFailed
          - WaitingForPrebookCancelation
          - PrebookCancelationInProgress
          - PrebookCanceled
          - PrebookCancelFailed
          - WaitingToBeRemoved
          - Removed
          - RemoveFailed
          - WaitingToBeReturned
          - Returned
          - ReturnFailed
          - WaitingToBeCompleted
          - CompletionInProgress
          - Completed
          - CompletionFailed
          - Paid
          - New
          - WaitingForEnrichmentTransfer
          - EnrichmentTransferInProgress
          - EnrichmentTransferred
          - EnrichmentTransferFailed
          - InDocumentFilter
          - DocumentFilterReleased
          type: string
          description: API processing status of the invoice (from accountingDocuments API).
          example: New
        disputeInfo:
          $ref: '#/components/schemas/DisputeInfo'
        lastUpdated:
          type: string
          description: Timestamp when the invoice record was last updated (from Basware P2P or from customer end).
          format: date-time
      additionalProperties: false
      description: ''
    PrebookResponseEntity:
      required:
      - externalCode
      - paymentBlock
      - responseMessage
      - success
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: External identifier
          example: ff842a95dbb445b8bb3dcb4d53e51f44
        success:
          maxLength: 250
          minLength: 1
          type: boolean
          description: Specifies if the invoice was succesfully prebooked to ERP system (true = invoice successfully prebooked, false = prebook failed). Note that if success = false, only the responseMessage and prebook status are saved to the invoice. Other fields, such as the voucher numbers or paymentBlock, are not updated.
          example: true
        responseMessage:
          maxLength: 250
          minLength: 1
          type: string
          description: Informative message for P2P user regarding the prebook. If prebook failed, please indicate reason for failure in this message. This message is shown in invoice action log.
          example: Prebooked to ERP
        sourceSystem:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Indicates the system that is returning prebook response.
          example: ERP1
        voucherNumber1:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Available for returning voucher number from ERP system. Voucher number is saved onto the invoice in P2P.
          example: '114785224'
        voucherNumber2:
          maxLength: 25
          minLength: 0
          type:
          - string
          - 'null'
          description: Available for returning second voucher number from ERP system. Voucher number 2 is saved onto the invoice in P2P.
          example: '774785220'
        prebookDate:
          type:
          - string
          - 'null'
          description: 'Prebook date. Note: Field is not saved to P2P (P2P saves the moment when prebook response message arrives).'
          format: date-time
        paymentBlock:
          type: boolean
          description: Available for indicating if invoice has been set to payment blocked -state by the receiving ERP system. Saved onto the invoice in P2P.
          example: false
      additionalProperties: false
