      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: External identifier that is used as a key in API. External code of the enrichmentResponse needs to be unique within an accountingDocument -record. Always create a new externalCode when sending response, there is no overwriting/editing of previous response. This will enable the visibility that all responses are tracked in API. ExternalCode in response messages plays no role in P2P (other than it is used in communication between P2P and the API layer).
          example: f24fff19120445de9c23651434129991
        success:
          type: boolean
          description: Specifies if the invoice was succesfully transfered to ERP system (true = invoice successfully transferred, false = transfer failed).
          example: true
        responseMessage:
          maxLength: 250
          minLength: 1
          type: string
          description: Informative message for P2P user regarding the transfer. If transfer failed, please indicate reason for transfer failure in this message. This message is shown in invoice action log.
          example: Enriched invoice contents transferred for payment approval in ERP .
        sourceSystem:
          maxLength: 32
          minLength: 0
          type:
          - string
          - 'null'
          description: Indicates the system that is returning prebook response.
          example: ERP1
        transferDate:
          type:
          - string
          - 'null'
          description: 'Transfer date. Saved onto the invoice in P2P. Note: Field needs to be made visible in P2P UI to see sent value.'
          format: date-time
      additionalProperties: false
      description: enrichment response entity
