openapi: 3.0.2
info:
  title: Basware OAUTH2 authentication APIs AccountingDocuments API
  description: "**Using OAUTH2.0 authentication:**\n\nGet API access token from api.basware.com/tokens\n1. Using client id and client secret, which you can obtain from Basware. \n2. Specify which APIs can be accessed by using the token e.g. Read only access to vendors API only (these are called scopes). Available scopes are listed at <https://developer.basware.com/api/p2p/manual#AccessRights>. \n3. Each token has an expiration time, until which it can be used to call APIs.\n\nWhen using OAUTH2 authentication, you need to pass the OAUTH2 authentication token when calling Basware API endpoints. Available Basware API operations are documented at <https://api.basware.com/swagger>. \n\nSee the Basware API developer site at <https://developer.basware.com/api/p2p/manual#Authentication> for more details on API authentication."
  version: 1.0.0
  x-logo:
    url: https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png
tags:
- name: AccountingDocuments
paths:
  /v1/accountingDocuments:
    get:
      tags:
      - AccountingDocuments
      summary: Returns invoices approved for transfer to accounting.
      description: "Notes: \r\n1) This API supports sending webhook based  [push notifications](https://developer.basware.com/api/p2p/manual#PushNotifications) when new data is available to be exported. \r\n2) This GET operation returns a HTTP redirect, which the API client needs to follow. \r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: ProcessingStatus
        in: query
        description: "Document status filter. Returns items by accounting document status.\r\n            \n To get new invoices waiting for transfer, use filter 'WaitingForTransfer'. See [diagram on developer site](https://developer.basware.com/api/p2p/manual#ProcessingStatusDiagram) for details on available status transitions.\r\n            \n⚠️ Important: Enrichment-related statuses (e.g. 'WaitingForEnrichmentTransfer', 'EnrichmentTransferInProgress', 'EnrichmentTransferred', 'EnrichmentTransferFailed') are only applicable when 'p2pProcessingMode=InvoiceEnrichment' is used.\r\n            \nIf these statuses are used without setting 'p2pProcessingMode=InvoiceEnrichment', no results will be returned.\n"
        schema:
          enum:
          - WaitingForPrebook
          - PrebookInProgress
          - Prebooked
          - PrebookFailed
          - WaitingForTransfer
          - TransferInProgress
          - Transferred
          - TransferFailed
          - WaitingForPrebookCancelation
          - PrebookCancelationInProgress
          - PrebookCanceled
          - PrebookCancelFailed
          - WaitingToBeRemoved
          - Removed
          - RemoveFailed
          - WaitingToBeReturned
          - Returned
          - ReturnFailed
          - WaitingToBeCompleted
          - CompletionInProgress
          - Completed
          - CompletionFailed
          - Paid
          - New
          - WaitingForEnrichmentTransfer
          - EnrichmentTransferInProgress
          - EnrichmentTransferred
          - EnrichmentTransferFailed
          - InDocumentFilter
          - DocumentFilterReleased
          type: string
      - name: pageSize
        in: query
        description: A limit for the number of items to be returned for one request. Limit can range between 1 and 100 items. For invoices with large numbers of coding rows, number of invoices returned will be less in order to limit response message size.
        schema:
          type: integer
          format: int32
          default: 100
      - name: companyCode
        in: query
        description: Company filter. Returns items for specific company.
        schema:
          type: string
          default: ''
      - name: lastUpdated
        in: query
        description: Date filter. Returns items that have been updated after specified date.
        schema:
          type: string
          format: date-time
      - name: p2pProcessingMode
        in: query
        description: "Defines the P2P flow type for which invoices are being returned. 'Standard' refers to the standard P2P flow where transferred invoices are already approved for payment. 'InvoiceEnrichment' refers to using P2P to only validate and enrich invoice contents - in this case the approval for payment is expected to be done in another system. Default: Standard. Both types of documents are not returned in the same request.\r\n            \n⚠️ Note: To retrieve documents in enrichment-related ProcessingStatus values, this parameter must be set to 'InvoiceEnrichment'.\n"
        schema:
          enum:
          - Standard
          - InvoiceEnrichment
          type: string
          default: Standard
      - name: x-amz-meta-continuationtoken
        in: header
        description: Used to get next page of results when item count indicated by 'pageSize' is exceeded. A token is returned in header (not body) parameter 'X-amz-meta-continuationToken' of the response whenever there are more records to fetch. Post the received value here in a new HEADER parameter on the next GET request to receive the next page of results. When getting the next page of results, you must include the same query parameters that were used when getting the first page.
        schema:
          type: string
        example: e799fdb7-222c-4e0f-af2f-881f4beae654
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
        '302':
          description: Redirect
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
    delete:
      tags:
      - AccountingDocuments
      summary: Deletes data from Basware API. For manual one-time operations.
      description: "For manual one-time operations only, such as a manual clean-up to remove test data generated during API integration development. Only removes records from API layer. \r\nDeletion in target systems needs to be done separately using the data deletion mechanisms available in each of the target system in addition to deleting the data in Basware API."
      requestBody:
        description: "Contains the body of the request.\r\n            Either externalCode or lastUpdated -field is required. If both values are provided, externalCode will have the priority."
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '202':
          description: RequestAccepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          description: BadRequest
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
  /v1/accountingDocuments/{invoiceId}:
    get:
      tags:
      - AccountingDocuments
      summary: Returns single approved invoice by invoiceId -identifier.
      description: "Note: This GET operation returns a HTTP redirect, which the API client needs to follow. \r\n* 'Authorization' header must not be included in the redirected request (the second request after receiving a redirect). \r\n* 'Host' header needs to be included.\r\n\r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: The Invoice Id of the entity to be fetched
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
        '302':
          description: Redirect
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
  /v1/accountingDocuments/{invoiceId}/acknowledge:
    post:
      tags:
      - AccountingDocuments
      summary: Acknowledged invoices are no longer offered for next GET operation. Done right after GET, before transferResponse.
      description: "Notes: \r\n1) Updates 'processingStatus' -field on the invoice to allow filtering out the invoice on the next GET operation. \r\n2) For an invoice which is already acknowledged (processingStatus: 'TransferInProgress' or 'PrebookInProgress'), API will return 405 'Method not allowed' if acknowledge is attempted again on the invoice.\r\n      \r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: Invoice Id of the accountingDocument to be acknowledged.
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to acknowledge not found.
        '405':
          description: Method Not allowed. This generally happens when trying to acknowledge an accountingDocument that is already acknowledged.
        '500':
          description: Unexpected error
  /v1/accountingDocuments/{invoiceId}/enrichmentResponses:
    post:
      tags:
      - AccountingDocuments
      summary: Marks invoice transfer P2P as accepted / rejected by receiving system. Used with invoices having 'p2pProcessingMode' = 'InvoiceEnrichment' which are not approved for payment.
      description: "Notes: \r\n1) Enrichment responses for already enrichment transferred invoices are not allowed.\r\n2) Please do not send acknowledge and enrichmentResponse for at the same time for the same invoice. If acknowledge is used, please wait for acknowledge to complete before sending the enrichmentResponse.\r\n3) Only latest 100 responses will be saved per invoice.\r\n\r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: Invoice Id of the accountingDocument to be updated
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        description: Transfer response to be added to accountingDocument
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/EnrichmentResponseEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichmentResponseEntity'
          text/json:
            schema:
              $ref: '#/components/schemas/EnrichmentResponseEntity'
          application/*+json:
            schema:
              $ref: '#/components/schemas/EnrichmentResponseEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EnrichmentResponseEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentResponseEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/EnrichmentResponseEntity'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to update not found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
  /v1/accountingDocuments/{invoiceId}/prebookResponses:
    post:
      tags:
      - AccountingDocuments
      summary: Marks invoice prebooking as accepted / rejected by receiving system.
      description: "Notes: \r\n1. Prebook responses for already prebooked invoices (where processingStatus = 'Prebooked') are not allowed.\r\n2. Saving voucher numbers and payment block -information to the invoice in P2P requires a succesful prebook response from ERP ('success' = 'true'). The responseMessage gets saved also when success = false.\r\n3. Please do not send acknowledge and prebookResponse at the same time for the same invoice. If acknowledge is used, please wait for acknowledge to complete before sending the transferResponse.\r\n4. Prebook failed -invoices (success = false) are processed manually in P2P.\r\n5. Only latest 100 responses will be saved per invoice.\r\n\r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: Invoice Id of the accountingDocument to be updated
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        description: Prebook responses to be added to accountingDocument
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PrebookResponseEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/PrebookResponseEntity'
          text/json:
            schema:
              $ref: '#/components/schemas/PrebookResponseEntity'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PrebookResponseEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PrebookResponseEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/PrebookResponseEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/PrebookResponseEntity'
        '401':
          description: Unauthorized
        '404':
          description: Not Found. Record to update not found.
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '400':
          description: Bad request
  /v1/accountingDocuments/{invoiceId}/transferResponses:
    post:
      tags:
      - AccountingDocuments
      summary: Marks invoice transfer as accepted / rejected by receiving system. Used with invoices having 'p2pProcessingMode' = 'Standard' which are approved for payment.
      description: "Notes: \r\n1) Transfer responses for already transferred invoices (where processingStatus = 'Transferred') are not allowed. \r\n2) Saving voucher numbers and payment block -information to the invoice in P2P requires a succesful transfer to ERP ('success' = 'true'). The responseMessage gets saved also when success = false. \r\n3) Please do not send acknowledge and transferResponse for at the same time for the same invoice. If acknowledge is used, please wait for acknowledge to complete before sending the transferResponse. \r\n4) Only latest 100 responses will be saved per invoice.\r\n\r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: Invoice Id of the accountingDocument to be updated
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        description: Transfer response to be added to accountingDocument
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/TransferResponseEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/TransferResponseEntity'
          text/json:
            schema:
              $ref: '#/components/schemas/TransferResponseEntity'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TransferResponseEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TransferResponseEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponseEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/TransferResponseEntity'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to update not found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
  /v1/accountingDocuments/{invoiceId}/paymentResponses:
    post:
      tags:
      - AccountingDocuments
      summary: Updates invoice payment information, including payment date.
      description: "Notes: \r\n1) Payment response can be sent multiple times for the same invoice (for example when updating partial payments). When sending multiple payment responses to the same invoice, externalCode needs to be different on each of the paymentResponse updates. \r\n2) Please post a payment response only when data related to it on the invoice has changed (do not post same contents repeatedly).\r\n3) Fields not included on the payment response will be cleared (e.g. paymentMethod). \r\n4) Current date is defaulted as payment date if payment date is empty. \r\n5) Only latest 100 responses will be saved per invoice.\r\n\r\nPlease see section \"[Usage scenario 3: Prebook and transfer invoice to Accounting](https://developer.basware.com/api/p2p/manual#usage3)\" of Basware Purchase-to-Pay API manual for details on implementing invoice transfer process with Basware API."
      parameters:
      - name: invoiceId
        in: path
        description: Invoice Id of the accountingDocument to be updated
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: Specifies the media type of the resource. Value application/json is supported.
        schema:
          type: string
        example: application/json
      requestBody:
        description: Payment response to be added to accountingDocument
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PaymentResponseEntity'
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentResponseEntity'
          text/json:
            schema:
              $ref: '#/components/schemas/PaymentResponseEntity'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PaymentResponseEntity'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PaymentResponseEntity'
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseEntity'
            text/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseEntity'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Record to update not found.
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
        '400':
          description: Bad request
  /v1/accountingDocuments/status:
    get:
      tags:
      - AccountingDocuments
      summary: Returns high level invoice status by search criteria such as company code, invoice number and invoice date.
      description: "This API receives search criteria such as company code, invoice number, invoice date and gross sum and returns the status, i.e. ‘In Approval Process’, ‘Ready For Payment’, ‘Paid’ or ‘Rejected’. This API can return data also for invoices transferred to ERP outside of Basware API using a webservice or file based integration (Anyerp transferred invoices). \r\n\r\nFollowing high-level statuses are returned. \r\n* InApprovalProcess - Invoice has been received in Basware P2P and is being processed. This includes all invoice statuses before succesful transfer to ERP.\r\n* ReadyForPayment - Invoice is approved for payment and has been transferred to ERP system.\r\n* Paid - Invoice has been paid.\r\n* Rejected - Invoice has been rejected.\r\n\r\nNotes:\r\n1) The API returns only status information and the invoiceId(s). If more information regarding the returned invoice(s) is required, doing a GET accountingDocuments/{invoiceId} query will return the full invoice details.\r\n2) To enable this feature for your organization, please contact your Basware consultant or Basware Support. Before the API is enabled, it will return no results. \r\n\r\nPlease see section \"[Usage scenario 7: Retrieve invoice status](https://developer.basware.com/api/p2p/manual#usage8)\" of Basware Purchase-to-Pay API manual for details on retrieving invoice status through Basware API."
      parameters:
      - name: companyCode
        in: query
        description: Company filter. Returns invoices for specified company.
        required: true
        schema:
          type: string
      - name: invoiceNumber
        in: query
        description: Invoice number filter. Returns invoices having specified invoice number.
        required: true
        schema:
          type: string
      - name: invoiceDate
        in: query
        description: Invoice date filter. Returns invoices having specified invoice date.
        required: true
        schema:
          type: string
          format: date-time
      - name: grossSum
        in: query
        description: Gross sum filter. Returns invoices having specified gross sum.
        schema:
          type: number
          format: double
      - name: pageSize
        in: query
        description: Page size filter. A limit for the number of items to be returned for one request. Limit can range between 1 and 500 items.
        schema:
          type: integer
          format: int32
          default: 500
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingDocumentsStatusResponseEntity'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingDocumentsStatusResponseEntity'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountingDocumentsStatusResponseEntity'
        '401':
          description: Unauthorized
        '404':
          description: Not found. Request was successful and no records were found.
        '500':
          description: Unexpected error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
  /v1/accountingDocuments/{invoiceId}/attachments/{attachmentExternalCode}:
    get:
      tags:
      - AccountingDocuments
      summary: Returns invoice attachment(s) by attachmentExternalCode identifier.
      description: "This API returns invoice attachments(s) by invoiceId and attachmentExternalCode identifiers. The attachmentExternalCode identifiers are available on the attachments block in main accountingDocuments API. \r\n\r\nNotes: \r\n 1) The API response redirects to a pre-signed URL. Make sure your API client will follow the '302' redirect to the returned new URL. The pre-signed URL will be valid for 15min.\r\n 2) This API is enabled manually through CMN_TENANT_SETTINGS parameter 'OpenApi.SendInvoiceAttachments' in P2P."
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
      - name: attachmentExternalCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '302':
          description: Found
        '401':
          description: Unauthorized
        '404':
          description: Not found. No attachment found by given attachmentExternalCode.
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResponseEntityList'
components:
  schemas:
    TransferResponseEntity:
      required:
      - externalCode
      - paymentBlock
      - responseMessage
      - success
      type: object
      properties:
        externalCode:
          maxLength: 36
          minLength: 1
          type: string
          description: External identifier that is used as a key in API. External code of the transferResponse needs to be unique within an accountingDocument -record. You should always create a new externalCode when sending response, there is no overwriting/editing of previous response. This will enable the visibility that all responses are tracked in API. ExternalCode in response messages plays no role in P2P (other than it is used in communication between P2P and the API layer).
          example: 9c857869cb5c4028ac79b03b57af12795
        success:
          type: boolean
          description: Specifies if the invoice was succesfully transfered to ERP system (true = invoice successfully transferred, false = transfer failed).
          example: true
        responseMessage:
          maxLength: 250
          minLength: 1
          type: string
          description: Informative message for P2P user regarding the transfer. If transfer failed, please indicate reason for transfer failure in this message. This message is shown in invoice action log.
          example: Invoice transferred to ERP.
        sourceSystem:
          maxLength: 32
          minLength: 0
          type: string
          description: Indicates the system that is returning transfer response.
          nullable: true
          example: ERP1
        voucherNumber1:
          maxLength: 25
          minLength: 0
          type: string
          description: Available for returning voucher number from ERP system. Voucher number is saved onto the invoice in P2P.
          nullable: true
          example: '114785224'
        voucherNumber2:
          maxLength: 25
          minLength: 0
          type: string
          description: Available for returning second voucher number from ERP system. Voucher number 2 is saved onto the invoice in P2P.
          nullable: true
          example: '774785220'
        transferDate:
          type: string
          description: 'Transfer date. Saved onto the invoice in P2P. Note: Field needs to be made visible in P2P UI to see sent value.'
          format: date-time
          nullable: true
        paymentBlock:
          type: boolean
          description: Available for indicating if invoice has been set to payment blocked -state by the receiving ERP system. Saved onto the invoice in P2P.
          example: false
      additionalProperties: false
    TransferParameterEntity:
      required:
      - key
      - value
      type: object
      properties:
        key:
          maxLength: 250
          minLength: 1
          type: string
          example: InvoiceBatchId
        value:
          maxLength: 250
          minLength: 1
          type: string
          example: ca7f0c603388437ea9584446e26cf01c
      additionalProperties: false
    AccountingDocumentResponse:
      required:
      - accountingDocuments
      type: object
      properties:
        accountingDocuments:
          type: array
          items:
            $ref: '#/components/schemas/AccountingDocumentEntity'
      additionalProperties: false
    DeleteRequest:
      type: object
      properties:
        lastUpdated:
          type: string
          description: 'To delete records updated after specific time, use lastUpdated -field. This will delete all items that have been updated after the specified date. In response, user will get the taskStatus api link where the task status can be checked. Note: ''0001-01-01'' can be used to delete all records.'
          format: date-time
          nullable: true
        externalCode:
          maxLength: 36
          minLength: 0
          type: string
          description: Single item can be deleted using externalCode and final status is returned immediately.
          nullable: true
      additionalProperties: false
    DeleteResponse:
      type: object
      properties:
        statusApiLink:
          type: string
          nullable: true
        taskName:
          type: string
          nullable: true
        taskStatus:
          type: string
          nullable: true
      additionalProperties: false
    AccountingDocumentEntity:
      required:
      - companyCode
      - currencyCode
      - invoiceId
      - paymentBlock
      - processingStatus
      - supplierCode
      type: object
      properties:
        invoiceId:
          maxLength: 36
          minLength: 1
          type: string
          description: Unique identifier for an invoice generated by Basware P2P. Must be returned in when sending acknowledgement, transferResponse or paymentResponse to the invoice.
          example: 138e7d94997847aebe7432e521b3dac9
        bumid:
          maxLength: 36
          minLength: 0
          type: string
          description: Unique identifier for a business document generated by BT, used between Basware P2P and other Basware systems.
          nullable: true
          example: c6d7067f-eb67-4289-89ec-819446078a3a
        p2pProcessingMode:
          enum:
          - Standard
          - InvoiceEnrichment
          type: string
          description: Specifies the P2P processing mode for the invoice. Standard = Ivoice has been processed in Basware P2P and is approved for payment. InvoiceEnrichment = Invoice data contents have been enriched for processing, invoice approval is to be handled separately in receiving system.
          example: Standard
        invoiceNumber:
          maxLength: 100
          minLength: 0
          type: string
          description: Invoice number (from supplier).
          nullable: true
          example: '80000330200233'
        voucherNumber1:
          maxLength: 25
          minLength: 0
          type: string
          description: Voucher Number 1 (for accounting). Voucher numbers can be generated by Basware or returned from customer ERP.
          nullable: true
          example: '114785224'
        voucherNumber2:
          maxLength: 25
          minLength: 0
          type: string
          description: Voucher Number 2 (for accounting). Voucher numbers can be generated by Basware or returned from customer ERP.
          nullable: true
          example: '774785220'
        voucherDate:
          type: string
          description: Voucher date can be used to determine the target accounting period for invoice in receiving (ERP) system.
          format: date-time
          nullable: true
        processingStatus:
          enum:
          - WaitingForPrebook
          - PrebookInProgress
          - Prebooked
          - PrebookFailed
          - WaitingForTransfer
          - TransferInProgress
          - Transferred
          - TransferFailed
          - WaitingForPrebookCancelation
          - PrebookCancelationInProgress
          - PrebookCanceled
          - PrebookCancelFailed
          - WaitingToBeRemoved
          - Removed
          - RemoveFailed
          - WaitingToBeReturned
          - Returned
          - ReturnFailed
          - WaitingToBeCompleted
          - CompletionInProgress
          - Completed
          - CompletionFailed
          - Paid
          - New
          - WaitingForEnrichmentTransfer
          - EnrichmentTransferInProgress
          - EnrichmentTransferred
          - EnrichmentTransferFailed
          - InDocumentFilter
          - DocumentFilterReleased
          type: string
          description: Processing status of the invoice in Basware API.
        originService:
          type: integer
          description: Describes how the invoice got created (as e-invoice, scanned from paper, extracted from pdf, etc)
          format: int32
        companyCode:
          maxLength: 32
          minLength: 1
          type: string
          description: Company code.
          example: BW00
        companyName:
          maxLength: 250
          minLength: 2
          type: string
          description: Company name.
          nullable: true
          example: Basware Helsinki
        organizationCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Organization element in the higher level of the organization than companyCode. This organization element collects the spend from the lower organization units.
          nullable: true
          example: BWFIN
        organizationName:
          maxLength: 250
          minLength: 0
          type: string
          description: Organization element name.
          nullable: true
          example: Basware Finland
        supplierCode:
          maxLength: 25
          minLength: 0
          type: string
          description: A party that supplied goods or services referred in the invoice.
          example: '430022'
        supplierName:
          maxLength: 250
          minLength: 0
          type: string
          description: Supplier name.
          nullable: true
          example: Easy Office Supplies Inc.
        currencyCode:
          maxLength: 3
          minLength: 2
          type: string
          description: Invoice currency.
          example: EUR
        netSum:
          type: number
          description: Invoice net sum (invoice total without tax), in invoice currecy.
          format: double
          nullable: true
          example: 1000
        grossSum:
          type: number
          description: Invoice gross sum (invoice total with tax), in invoice currecy.
          format: double
          nullable: true
          example: 1160
        taxCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Tax code.
          nullable: true
          example: T16
        taxPercent1:
          maximum: 1000000000
          minimum: -1000000000
          type: number
          description: Tax percentage.
          format: double
          nullable: true
          example: 16
        taxPercent2:
          type: number
          description: Second tax percentage (for example for partially deductible VAT).
          format: double
          nullable: true
          example: 0
        taxSum1:
          type: number
          description: Invoice tax sum to be paid, in invoice currency.
          format: double
          nullable: true
          example: 160
        taxSum2:
          type: number
          description: Invoice tax sum that is excluded from the tax sum to be paid, in invoice currency.
          format: double
          nullable: true
          example: 0
        invoiceDate:
          type: string
          description: Invoice date (from supplier).
          format: date-time
          nullable: true
        baseLineDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          description: Due date. The last payment date before penalties.
          format: date-time
          nullable: true
        cashDate:
          type: string
          description: Cash cate. The last payment date with discount.
          format: date-time
          nullable: true
        cashPercent:
          maximum: 100
          minimum: 0
          type: number
          description: Percentage out of invoice total that can be excluded if the invoice is paid before the cashDate.
          format: double
          nullable: true
          example: 2
        cashSum:
          type: number
          description: Cash discount amount in invoice currency.
          format: double
          nullable: true
          example: 23.2
        referencePerson:
          maxLength: 255
          minLength: 0
          type: string
          description: Person that has been referenced in the invoice.
          nullable: true
          example: Jane Buyer
        contractNumber:
          maxLength: 250
          minLength: 0
          type: string
          description: Contract number.
          nullable: true
          example: AX94055432
        description:
          maxLength: 250
          minLength: 0
          type: string
          description: A short description of an invoice.
          nullable: true
          example: More information about the invoice.
        invoiceTypeCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Invoice type code.
          nullable: true
          example: RE
        invoiceTypeName:
          maxLength: 250
          minLength: 0
          type: string
          description: Invoice type name.
          nullable: true
          example: Purchase order based invoice
        paymentMethod:
          maxLength: 25
          minLength: 0
          type: string
          description: Payment method.
          nullable: true
          example: BankTransfer
        paymentBlock:
          type: boolean
          description: Identifies if the payment of this invoice should be denied by the ERP system and additonal steps like approval must take place before the invoice can be paid. Normally this parameter has value False when Basware P2P sends invoice for transfer.
          example: false
        paymentTermCode:
          maxLength: 25
          minLength: 0
          type: string
          description: Payment term code.
          nullable: true
          example: 7D2-NT30
        paymentTermName:
          maxLength: 250
          minLength: 0
          type: string
          description: Payment term name.
          nullable: true
          example: 7 days -2%, 30 days Net
        paymentTermExternalCode:
          maxLength: 100
          minLength: 0
          type: string
          description: Payment term external code.
          nullable: true
          example: 7D2-NT30
        paymentPlanReference:
          maxLength: 255
          minLength: 0
          type: string
          description: Payment plan reference.
          nullable: true
          example: 737-12321
        paymentRevelsalDocument:
          maxLength: 250
          minLength: 0
          type: string
          description: Payment reversal document.
          nullable: true
          example: '245576456'
        codingDate:
          type: string
          description: Coding date.
          format: date-time
          nullable: true
        prebooked:
          type: boolean
          description: Identifies if the cost is already prebooked in ERP system. Some systems require prebooking the cost before invoice can be sent for payment.
          nullable: true
          example: false
        referenceNumber:
          maxLength: 50
          minLength: 0
          type: string
          description: Payment reference number.
          nullable: true
          example: 16422-3210654-1872000-1110
        supplierBankIBAN:
          maxLength: 50
          minLength: 0
          type: string
          description: Supplier bank account (IBAN).
          nullable: true
          example: IT60X0542811101000000123456
        supplierBankBBAN:
          maxLength: 50
          minLength: 0
          type: string
          description: Supplier bank account.
          nullable: true
          example: '539007547034'
