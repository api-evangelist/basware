openapi: 3.0.2
info:
  title: Basware OAUTH2 authentication APIs AccountingDocuments Document Import API API
  description: "**Using OAUTH2.0 authentication:**\n\nGet API access token from api.basware.com/tokens\n1. Using client id and client secret, which you can obtain from Basware. \n2. Specify which APIs can be accessed by using the token e.g. Read only access to vendors API only (these are called scopes). Available scopes are listed at <https://developer.basware.com/api/p2p/manual#AccessRights>. \n3. Each token has an expiration time, until which it can be used to call APIs.\n\nWhen using OAUTH2 authentication, you need to pass the OAUTH2 authentication token when calling Basware API endpoints. Available Basware API operations are documented at <https://api.basware.com/swagger>. \n\nSee the Basware API developer site at <https://developer.basware.com/api/p2p/manual#Authentication> for more details on API authentication."
  version: 1.0.0
  x-logo:
    url: https://fastapi.tiangolo.com/img/logo-margin/logo-teal.png
tags:
- name: Document Import API
paths:
  /v2/smartpdf/invoiceUpload:
    post:
      tags:
      - Document Import API
      summary: Upload Document Basic Auth
      description: Post upload document metadata and receive a presigned URL for uploading the document
      operationId: upload_document_basic_auth_v2_smartpdf_invoiceUpload_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                CONFIGURATION_NOT_FOUND:
                  value:
                    detail: Configuration not found
                UNAUTHORIZED_OAUTH:
                  value:
                    detail: OAuth authorization failed.
                BASWARE_CUSTOMER_ID_MISMATCH:
                  value:
                    detail: Basware Customer ID does not match.
                INVALID_JWT_TOKEN:
                  value:
                    detail: Invalid JWT token.
                NO_AUTH_METHOD_PROVIDED:
                  value:
                    detail: No authentication method provided.
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                FORBIDDEN:
                  value:
                    detail: Forbidden
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                BOTH_AUTH_METHODS_PROVIDED:
                  value:
                    detail: Both JWT token and Basic Auth credentials provided.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
